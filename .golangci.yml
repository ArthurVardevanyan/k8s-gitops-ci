run:
  timeout: 10m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofumpt
    - goimports
    - misspell
    - revive

linters-settings:
  gofumpt:
    extra-rules: true
  goimports:
    local-prefixes: github.com/ArthurVardevanyan/k8s-gitops-ci

issues:
  exclude-use-default: false
