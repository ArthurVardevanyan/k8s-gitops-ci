# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: k8s-gitops-ci
before:
  hooks:
    - go mod tidy
    # Regenerate the embedded kubeconform schema / kyverno policy archives
    # (schemas.tar.gz / policies.tar.gz) so they're guaranteed present on
    # disk before the embedschemas-tagged build below needs them via
    # `//go:embed` - matches `task build`'s own [update:schemas,
    # update:policies] deps (see Taskfile.yml). In the real Tekton release
    # pipeline `task ci` already ran these moments earlier in the same
    # step, so this is a fast no-op there; it only does real work for a
    # standalone local `goreleaser build`/`release` (see
    # docs/RELEASE.md's "Dry-run locally" section).
    - task update:schemas
    - task update:policies
    - go generate ./...
builds:
  - id: k8s-gitops-ci
    main: ./cmd/k8s-gitops-ci
    binary: k8s-gitops-ci
    env:
      - CGO_ENABLED=0
    # Without this, released binaries silently diverge from `task build`'s
    # (see Taskfile.yml): the `!embedschemas`-gated stub compiles in
    # instead, so kubeconform.ExtractSchemas returns
    # schemas.ErrNoEmbeddedArchive and every CRD-only schema lookup
    # (CustomResourceDefinition, and anything only present in the
    # embedded custom-standalone-strict/master-local archive) fails with
    # "could not find schema for X" at runtime - see docs/SCHEMAS.md.
    flags:
      - -tags=embedschemas
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.BuildVersion={{.Version}}
      - -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.BuildTime={{.Date}}
      - -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.Commit={{.Commit}}
kos:
  - repositories:
      - registry.arthurvardevanyan.com/homelab/k8s-gitops-ci
    tags:
      - "{{.Version}}"
      - latest
    bare: true
    preserve_import_paths: false
    platforms:
      - linux/amd64
      - linux/arm64
    main: ./cmd/k8s-gitops-ci
changelog:
  # Use GitHub's native auto-generated release notes ("What's Changed" +
  # New Contributors + Full Changelog compare link) as the release body.
  # The Tekton release step no longer passes --release-notes, so GoReleaser
  # renders these instead of a git-cliff CHANGELOG. git-cliff is still used
  # in .tekton/k8s-gitops-ci.yaml, but only for version bumping
  # (--bumped-version), not for the release body.
  use: github-native
release:
  github:
    owner: ArthurVardevanyan
    name: k8s-gitops-ci
