# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  NAME: k8s-gitops-ci
  # renovate: datasource=go depName=golang.org/x/tools
  GOIMPORTS_VERSION: v0.48.0
  # renovate: datasource=go depName=mvdan.cc/gofumpt
  GOFUMPT_VERSION: v0.11.0
  # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
  GOLANGCI_LINT_VERSION: v2.12.2
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.6.0
  # TOOLS defaults to the in-repo .tool/ dir, but honors a
  # K8S_GITOPS_CI_TOOLS_DIR env override so CI can redirect the installed
  # Go tools (golangci-lint, govulncheck, gofumpt, goimports) onto a
  # persistent cache volume instead of the fresh-clone workspace — without
  # it, install-tools re-links all four every run because .tool/ starts
  # empty on each checkout.
  TOOLS: '{{.TOOLS | default (env "K8S_GITOPS_CI_TOOLS_DIR") | default (printf "%s/.tool" (.ROOT_DIR | toSlash)) }}'
  TOOLS_BIN: "{{.TOOLS}}"
  DIST: "{{.ROOT_DIR | toSlash}}/bin"
  PATH_SEP: "{{ if eq OS `windows` }};{{ else }}:{{ end }}"
  TOOLS_PATH: "{{.TOOLS_BIN}}{{.PATH_SEP}}{{.DIST}}"
  MAIN_PACKAGE: ./cmd/k8s-gitops-ci
  COVER: "{{.ROOT_DIR | toSlash}}/.task/cover"
  BUILD_COMMIT:
    sh: git rev-parse HEAD 2>/dev/null || echo nightly
  GIT_SHA:
    sh: git rev-parse --short=12 HEAD 2>/dev/null || echo unknown
  BUILD_VERSION:
    sh: |
      if [ -n "${BUILD_VERSION:-}" ]; then
        echo "${BUILD_VERSION}"
        exit 0
      fi
      # VERSION is the single source of truth for the version (see
      # docs/RELEASE.md): the release pipeline tags v${VERSION} when a merge
      # to main advances it. Local/dev builds append -local so they're never
      # mistaken for the released binary of that version (goreleaser injects
      # the real tag via .goreleaser.yaml's ldflags at release time).
      VERSION="$(tr -d '[:space:]' <VERSION 2>/dev/null)"
      if [ -z "${VERSION}" ]; then VERSION="0.0.1"; fi
      echo "${VERSION}-local"
  GIT_VERSION:
    sh: git describe --tags --always 2>/dev/null || echo dev
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.BuildVersion={{.BUILD_VERSION}}
    -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.BuildTime={{.BUILD_TIME}}
    -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.Commit={{.BUILD_COMMIT}}

env:
  CGO_ENABLED: "0"
  GOFLAGS: -mod=mod

# ── Info ──────────────────────────────────────────────────────────────────────
tasks:
  default:
    aliases: [info]
    silent: true
    desc: Display project information
    cmds:
      - |
        echo "------------------------------------------------------------"
        echo "{{.NAME}} Taskfile"
        echo "------------------------------------------------------------"
        echo "Common commands:"
        echo "  task           # this info"
        echo "  task ci        # full CI pipeline (lint + test + build)"
        echo "  task build     # build bin/k8s-gitops-ci"
        echo "  task test      # run tests"
        echo "  task lint      # run golangci-lint"
        echo "  task format    # auto-format Go sources"
        echo ""
        echo "  BUILD_VERSION: {{.BUILD_VERSION}}"
        echo "  BUILD_COMMIT:  {{.BUILD_COMMIT}}"
        echo "  GIT_SHA:       {{.GIT_SHA}}"
        echo "------------------------------------------------------------"

  # ── Version ───────────────────────────────────────────────────────────────────
  version:check:
    desc: Validate the VERSION file (semver; never behind the latest tag or main's VERSION)
    silent: true
    cmds:
      - |
        set -euo pipefail
        # VERSION is the single source of truth for releases: the pipeline
        # tags v${VERSION} when a merge to main advances it past the latest
        # tag (see docs/RELEASE.md). This guard runs in `task ci` so a
        # malformed, stale, or downgraded VERSION fails the PR instead of
        # surfacing only at release time.
        if [ ! -f VERSION ]; then
          echo "❌ VERSION file is missing"
          exit 1
        fi
        VERSION="$(tr -d '[:space:]' <VERSION)"
        if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "❌ VERSION '${VERSION}' is not valid MAJOR.MINOR.PATCH"
          exit 1
        fi

        # ge <a> <b>: true (0) iff a >= b, using version sort. Equal is
        # allowed everywhere below — only a strict *decrease* is rejected, so
        # ordinary non-release PRs (VERSION unchanged) always pass.
        ge() {
          [ "$1" = "$2" ] && return 0
          [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
        }

        # Guard 1: VERSION must not be behind the latest existing release tag.
        LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 | sed 's/^v//' || true)"
        if [ -n "${LATEST}" ] && ! ge "${VERSION}" "${LATEST}"; then
          echo "❌ VERSION '${VERSION}' is behind the latest release tag 'v${LATEST}'"
          exit 1
        fi

        # Guard 2: VERSION must not be behind the base branch's current
        # VERSION (catches a downgrade that's still >= the latest tag, e.g.
        # reverting a bump that hasn't been tagged yet). Base ref defaults to
        # origin/main but is overridable via VERSION_CHECK_BASE_REF — the
        # Tekton PR run fetches the target branch and sets this to FETCH_HEAD
        # (the clone otherwise lacks origin/main). Best-effort: silently
        # skips when the base ref or its VERSION file isn't resolvable, so
        # offline/local dev keeps working.
        BASE_REF="${VERSION_CHECK_BASE_REF:-origin/main}"
        BASE_VERSION=""
        if git rev-parse --verify --quiet "${BASE_REF}" >/dev/null 2>&1; then
          BASE_VERSION="$(git show "${BASE_REF}:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
        fi
        if [ -n "${BASE_VERSION}" ] \
          && printf '%s' "${BASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
          && ! ge "${VERSION}" "${BASE_VERSION}"; then
          echo "❌ VERSION '${VERSION}' is behind ${BASE_REF}'s VERSION '${BASE_VERSION}' (downgrade)"
          exit 1
        fi

        # Guard 3: bump-correctness. When VERSION advances past the latest
        # tag (i.e. this PR is claiming a release), the size of the bump must
        # be at least what the conventional commits since that tag warrant —
        # e.g. you can't ship a `feat:` as a patch bump. git-cliff computes
        # the expected bump (advisory only; VERSION still decides the number).
        # This blocks UNDER-bumps only; over-bumps are allowed. It is skipped
        # when VERSION == latest tag (a non-release PR — nothing to size) and
        # when git-cliff isn't installed (local dev), so it only ever hard-
        # gates a real release bump, and only where git-cliff is present (CI).
        bump_class() {
          # class of $1 relative to LATEST: 3=major, 2=minor, 1=patch, 0=none
          old_major="${LATEST%%.*}"; rest="${LATEST#*.}"; old_minor="${rest%%.*}"
          new_major="${1%%.*}"; rest="${1#*.}"; new_minor="${rest%%.*}"
          if [ "${new_major}" != "${old_major}" ]; then echo 3
          elif [ "${new_minor}" != "${old_minor}" ]; then echo 2
          elif [ "$1" != "${LATEST}" ]; then echo 1
          else echo 0; fi
        }
        if [ -n "${LATEST}" ] && [ "${VERSION}" != "${LATEST}" ] \
          && command -v git-cliff >/dev/null 2>&1; then
          SUGGESTED="$(git-cliff --bumped-version --unreleased 2>/dev/null | sed 's/^v//' || true)"
          if printf '%s' "${SUGGESTED}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            WANT="$(bump_class "${SUGGESTED}")"
            GOT="$(bump_class "${VERSION}")"
            if [ "${GOT}" -lt "${WANT}" ]; then
              kind="patch"; [ "${WANT}" = 2 ] && kind="minor"; [ "${WANT}" = 3 ] && kind="major"
              echo "❌ VERSION '${VERSION}' under-bumps: commits since v${LATEST} warrant a ${kind} bump (git-cliff suggests v${SUGGESTED}). Bump VERSION to at least that."
              exit 1
            fi
          fi
        fi

        echo "✅ VERSION ${VERSION} is valid (latest tag: ${LATEST:+v}${LATEST:-<none>}, ${BASE_REF} VERSION: ${BASE_VERSION:-<n/a>})"

  # ── Modules ───────────────────────────────────────────────────────────────────
  mod:
    desc: Download and tidy Go modules
    silent: true
    sources:
      - go.mod
      - go.sum
    cmds:
      - go mod download
      - go mod tidy

  mod:check:
    desc: Ensure go.mod and go.sum are tidy without modifying the working tree
    silent: true
    cmds:
      - |
        set -e
        cp go.mod go.mod.bak
        cp go.sum go.sum.bak
        if ! go mod tidy 2>&1; then
          echo "❌ go mod tidy failed"
          mv go.mod.bak go.mod
          mv go.sum.bak go.sum
          exit 1
        fi
        if diff -q go.mod go.mod.bak > /dev/null 2>&1 && diff -q go.sum go.sum.bak > /dev/null 2>&1; then
          echo "✅ go.mod and go.sum are tidy"
          rm -f go.mod.bak go.sum.bak
          exit 0
        fi
        echo "❌ go.mod and go.sum need tidying"
        diff go.mod.bak go.mod || true
        mv go.mod.bak go.mod
        mv go.sum.bak go.sum
        echo "Run 'task mod' to fix."
        exit 1

  mod:verify:
    desc: Verify Go module integrity and checksums
    silent: true
    cmds:
      - go mod verify

  # ── Tool installation ─────────────────────────────────────────────────────────
  install-tools:
    desc: Install all Go development tools to .tool/
    silent: true
    deps: [install-tools:go]
    cmds:
      - echo "✅ All development tools installed"

  install-tools:go:
    desc: Install Go tooling (golangci-lint, govulncheck, gofumpt, goimports)
    silent: true
    run: once
    env:
      GOBIN: "{{.TOOLS_BIN}}"
      PATH: "{{.TOOLS_PATH}}:{{ env `PATH` }}"
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"
        mkdir -p "{{.TOOLS_BIN}}"
        install_tool() {
          # Reinstalls whenever the pinned version changes, not just when the
          # binary is missing — otherwise a stale local .tool/ cache silently
          # drifts from the version pinned here (see #105 gofumpt incident).
          local name="$1" pkg="$2" version="$3"
          local marker="{{.TOOLS_BIN}}/.${name}.version"
          if [[ ! -x "{{.TOOLS_BIN}}/$name" ]] || [[ "$(cat "$marker" 2>/dev/null)" != "$version" ]]; then
            echo "[install] $name@$version"
            go install "${pkg}@${version}"
            echo "$version" > "$marker"
          fi
        }
        install_tool golangci-lint "github.com/golangci/golangci-lint/v2/cmd/golangci-lint" "{{.GOLANGCI_LINT_VERSION}}"
        install_tool govulncheck   "golang.org/x/vuln/cmd/govulncheck" "{{.GOVULNCHECK_VERSION}}"
        install_tool gofumpt       "mvdan.cc/gofumpt" "{{.GOFUMPT_VERSION}}"
        install_tool goimports     "golang.org/x/tools/cmd/goimports" "{{.GOIMPORTS_VERSION}}"

  # ── Formatting ────────────────────────────────────────────────────────────────
  format:
    desc: Auto-format Go code (goimports + gofumpt) and tidy modules
    deps: [install-tools]
    silent: true
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - "{{.TOOLS_BIN}}/goimports"
      - "{{.TOOLS_BIN}}/gofumpt"
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"
        echo "Formatting Go files..."
        find . -type f -name '*.go' \
          -not -path './.cache/*' \
          -not -path './.task/*' \
          -not -path './.tool/*' \
          -not -path './vendor/*' \
          -print0 | xargs -0 goimports -w
        find . \
          -type d \( -name .cache -o -name .task -o -name .tool -o -name vendor \) -prune -false \
          -o -type f -name '*.go' -print \
          | xargs gofumpt -w -extra
        go mod tidy
        echo "✅ Formatting complete"

  format:check:
    desc: Check Go formatting without modifying files (fails if changes needed)
    deps: [install-tools]
    silent: true
    sources:
      - "**/*.go"
      - "{{.TOOLS_BIN}}/goimports"
      - "{{.TOOLS_BIN}}/gofumpt"
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"
        changes=0
        UNFORMATTED=$(find . \
          -type d \( -name .cache -o -name .task -o -name .tool -o -name vendor \) -prune -false \
          -o -type f -name '*.go' -print0 \
          | xargs -0 goimports -l 2>/dev/null || true)
        if [ -n "$UNFORMATTED" ]; then
          echo "❌ goimports issues:"
          echo "$UNFORMATTED"
          changes=1
        fi
        UNFORMATTED=$(find . \
          -type d \( -name .cache -o -name .task -o -name .tool -o -name vendor \) -prune -false \
          -o -type f -name '*.go' -print0 \
          | xargs -0 gofumpt -l -extra 2>/dev/null || true)
        if [ -n "$UNFORMATTED" ]; then
          echo "❌ gofumpt issues:"
          echo "$UNFORMATTED"
          changes=1
        fi
        if [ "$changes" -ne 0 ]; then
          echo "Run 'task format' to fix."
          exit 1
        fi
        echo "✅ Code formatting is correct"

  # ── Lint & static analysis ────────────────────────────────────────────────────
  lint:
    desc: Run golangci-lint
    aliases: [l]
    silent: true
    deps: [install-tools, update:schemas, update:policies]
    sources:
      - "./**/*.go"
      - .golangci.yml
      - "{{.TOOLS_BIN}}/golangci-lint"
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"
        echo "Running golangci-lint..."
        golangci-lint run ./... --config .golangci.yml --timeout 5m0s
        echo "✅ No linting issues found"

  vet:
    desc: Run go vet
    silent: true
    sources:
      - "./**/*.go"
      - go.mod
      - go.sum
    cmds:
      - go vet ./...

  # ── Security ──────────────────────────────────────────────────────────────────
  vulncheck:
    desc: Check for known vulnerabilities (only fails on fixable findings)
    silent: true
    deps: [install-tools, update:schemas, update:policies]
    cmds:
      - |
        export PATH="{{.TOOLS_PATH}}:$PATH"
        OUTPUT=$(govulncheck -format json ./...)
        if echo "$OUTPUT" | grep -q '"fixed_version"'; then
          echo "ERROR: fixable vulnerabilities found:"
          govulncheck ./... || true
          exit 1
        fi
        if echo "$OUTPUT" | grep -q '"finding"'; then
          echo "WARNING: unfixable vulnerabilities (no patch available):"
          echo "$OUTPUT" | grep -o '"osv": "[^"]*"' | sort -u | sed 's/^/  /'
        else
          echo "✅ No vulnerabilities found"
        fi

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    desc: Build bin/{{.NAME}}
    silent: true
    deps: [update:schemas, update:policies]
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      # update:schemas/update:policies have no `sources:` of their own (they
      # always re-run to keep the pinned-SHA fetch honest), so without these
      # two lines Task's up-to-date check never notices a freshly-regenerated
      # archive - the go:embed'd content silently changes underneath a build
      # Task still considers "up to date" from the go-file fingerprint alone.
      - pkg/lint/kubeconform/schemas/schemas.tar.gz
      - pkg/lint/kyverno/policies/policies.tar.gz
    generates:
      - "{{.DIST}}/{{.NAME}}"
    cmds:
      - mkdir -p {{.DIST}}
      - >
        go build
        -tags embedschemas
        -ldflags '-w {{.LDFLAGS}}'
        -trimpath
        -o {{.DIST}}/{{.NAME}}
        {{.MAIN_PACKAGE}}

  # image:build and image:publish are commented out until the registry is wired up.
  # image:build:
  #   desc: Build and push container image with ko
  #   env:
  #     KO_DOCKER_REPO: '{{.KO_DOCKER_REPO | default "registry.arthurvardevanyan.com/homelab/k8s-gitops-ci"}}'
  #     BUILD_VERSION: "{{.BUILD_VERSION}}"
  #     BUILD_COMMIT: "{{.BUILD_COMMIT}}"
  #   cmds:
  #     - ko build {{.MAIN_PACKAGE}} --bare --sbom=none --tags={{.KO_TAGS | default "local"}}
  #
  # image:publish:
  #   desc: Build+push image and write .image-tag / .image-ref / .image-digest
  #   env:
  #     KO_DOCKER_REPO: '{{.KO_DOCKER_REPO | default "registry.arthurvardevanyan.com/homelab/k8s-gitops-ci"}}'
  #   cmds:
  #     - |
  #       ... (see upstream image:publish for full logic)

  # ── Testing ───────────────────────────────────────────────────────────────────
  test:
    desc: Run test suite
    aliases: [t]
    deps: [update:schemas, update:policies]
    env:
      # Default matches the top-level `env:` block's GOFLAGS (task-level env
      # fully replaces it, not merges) rather than forcing `-count=1` — the
      # latter defeated Go's own test-result cache on every run, even for
      # packages untouched since the last pass. Still overridable, e.g.
      # `task test GOFLAGS=-count=1` to force a full rerun.
      GOFLAGS: '{{.GOFLAGS | default "-mod=mod"}}'
      # No `-shuffle=on` default: it's not in `go test`'s cacheable-flag
      # set (see `go help test`), so passing it at all disables Go's test
      # result cache unconditionally - combined with the GOFLAGS change
      # above, this is what actually lets unchanged packages skip re-running
      # entirely. Still available via `task test GOTESTFLAGS=-shuffle=on`
      # to catch inter-test order dependencies on demand.
      GOTESTFLAGS: '{{.GOTESTFLAGS | default ""}}'
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      # See build's matching comment: without these, a regenerated archive
      # (e.g. after bumping SCHEMA_REPO_SHA) won't re-trigger `go test`.
      - pkg/lint/kubeconform/schemas/schemas.tar.gz
      - pkg/lint/kyverno/policies/policies.tar.gz
    cmds:
      - go test -tags embedschemas $GOTESTFLAGS -timeout 10m ./...

  test:cover:
    desc: Run tests with coverage profile + race detector
    silent: true
    deps: [update:schemas, update:policies]
    env:
      # See test's matching comment: default no longer forces `-count=1`,
      # so unchanged packages can reuse Go's cached test results.
      GOFLAGS: '{{.GOFLAGS | default "-mod=mod"}}'
      # See test's matching comment: no `-shuffle=on` default either, for
      # the same test-cache reason.
      GOTESTFLAGS: '{{.GOTESTFLAGS | default ""}}'
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      # See build's matching comment: without these, a regenerated archive
      # (e.g. after bumping SCHEMA_REPO_SHA) won't re-trigger `go test`.
      - pkg/lint/kubeconform/schemas/schemas.tar.gz
      - pkg/lint/kyverno/policies/policies.tar.gz
    cmds:
      - mkdir -p {{.COVER}}
      # CGO_ENABLED=1 set inline — the global CGO_ENABLED=0 is exported into
      # subprocesses and task-level env won't override it there.
      - CGO_ENABLED=1 go test -tags embedschemas $GOTESTFLAGS -race -covermode=atomic -coverprofile={{.COVER}}/cover.out -timeout 10m ./...

  test:race:
    desc: Alias for test:cover (race detector runs there)
    cmds:
      - task: test:cover

  test:homelab-prs:
    desc: Replay the last N merged PRs of a real GitOps repo (default HomeLab)
    silent: true
    deps: [build]
    vars:
      COUNT: '{{.COUNT | default "15"}}'
      PARALLEL: '{{.PARALLEL | default "5"}}'
      REPOS: '{{.REPOS | default "ArthurVardevanyan/HomeLab"}}'
      OUTPUT: '{{.OUTPUT | default ""}}'
    cmds:
      - >
        ./scripts/test-homelab-prs.sh
        --binary "{{.DIST}}/{{.NAME}}"
        --count "{{.COUNT}}"
        --parallel "{{.PARALLEL}}"
        --repos "{{.REPOS}}"
        {{if .OUTPUT}}--output "{{.OUTPUT}}"{{end}}

  coverage:report:
    desc: Print per-file coverage report
    silent: true
    deps: [test:cover]
    cmds:
      - go tool cover -func={{.COVER}}/cover.out

  coverage:html:
    desc: Generate HTML coverage report and open in browser
    silent: true
    deps: [test:cover]
    cmds:
      - go tool cover -html={{.COVER}}/cover.out -o {{.COVER}}/coverage.html
      - |
        echo "✅ HTML report: {{.COVER}}/coverage.html"
        if command -v xdg-open >/dev/null 2>&1; then xdg-open {{.COVER}}/coverage.html
        elif command -v open >/dev/null 2>&1; then open {{.COVER}}/coverage.html; fi

  # ── Full CI pipeline ──────────────────────────────────────────────────────────
  ci:
    desc: Full CI pipeline — version, mod check, format, schemas, lint, vulncheck, test, build
    silent: true
    vars:
      # Suffixed with the shell PID so concurrent/overlapping `task ci` runs
      # (e.g. a local run overlapping a CI run, or a retried pipeline step)
      # never truncate or interleave-write into the same timing file.
      CI_TIMEFILE_DEFAULT:
        sh: echo "{{.ROOT_DIR | toSlash}}/.task/ci-timings.$$"
      TIMEFILE: "{{.TIMEFILE | default .CI_TIMEFILE_DEFAULT}}"
    cmds:
      # Native `- task:` references preserve the Taskfile env (CGO_ENABLED, etc.)
      # across steps. Timing markers are appended to TIMEFILE and diffed at the end.
      - |
        set -euo pipefail
        mkdir -p "$(dirname "{{.TIMEFILE}}")"
        : > "{{.TIMEFILE}}"
        printf '%s\t%s\n' "$(date +%s.%N)" "START" >> "{{.TIMEFILE}}"
        echo "=========================================="
        echo "🚀 Starting CI Pipeline"
        echo "=========================================="
        echo ""
        echo "▶ Step 1/8  Version Check"
      - task: version:check
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 1/8  Version Check" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 2/8  Module Dependencies Check"
      - task: mod:check
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 2/8  Module Dependencies Check" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 3/8  Code Formatting Check"
      - task: format:check
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 3/8  Code Formatting Check" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 4/8  Schemas & Policies"
      - task: update:schemas
      - task: update:policies
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 4/8  Schemas & Policies" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 5/8  Linting"
      - task: lint
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 5/8  Linting" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 6/8  Vulnerability Check"
      - task: vulncheck
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 6/8  Vulnerability Check" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 7/8  Tests (coverage + race)"
      - task: test:cover
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 7/8  Tests (coverage + race)" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 8/8  Build"
      - task: build
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 8/8  Build" >> "{{.TIMEFILE}}"
      - |
        set -euo pipefail
        echo ""
        echo "=========================================="
        echo "✅ CI Pipeline Completed Successfully!"
        echo "=========================================="
        echo "⏱  Step timings (wall time):"
        awk -F'\t' '
          NR == 1 { prev = $1; next }
          {
            secs = $1 - prev
            total += secs
            printf "   %-38s %7.1fs\n", $2, secs
            prev = $1
          }
          END { printf "   %-38s %7.1fs\n", "TOTAL", total }
        ' "{{.TIMEFILE}}"
        echo "=========================================="
        rm -f "{{.TIMEFILE}}"

  # ── Clean ─────────────────────────────────────────────────────────────────────
  clean:
    desc: Remove build artifacts, caches, and temp files
    silent: true
    cmds:
      - |
        echo "🧹 Cleaning..."
        rm -rf bin/ dist/ .task/ .tool/
        find . -name "*.tmp" -type f -delete
        find . -name ".DS_Store" -type f -delete
        echo "✅ Clean complete"

  # ── Dependencies ──────────────────────────────────────────────────────────────
  update:deps:
    desc: Upgrade all Go dependencies and tidy go.mod/go.sum
    silent: true
    cmds:
      - |
        set -euo pipefail
        echo "🔍 Updating Go dependencies..."
        go get -u ./...
        go mod tidy
        echo "✅ Dependencies updated — run 'task test' to verify"

  update:
    desc: Run all update tasks (deps, schemas, policies, scoped-resources)
    silent: true
    cmds:
      - task: update:deps
      - task: update:schemas
      - task: update:policies
      - task: update:scoped-resources

  update:schemas:
    desc: Pull embedded kubeconform schemas from git
    cmds:
      - scripts/pull-schemas.sh
    generates:
      - pkg/lint/kubeconform/schemas/schemas.tar.gz

  update:policies:
    desc: Pull embedded kyverno policies (placeholder)
    cmds:
      - scripts/pull-policies.sh
    generates:
      - pkg/lint/kyverno/policies/policies.tar.gz

  update:scoped-resources:
    desc: Regenerate resource scope maps from kubectl api-resources
    cmds:
      - scripts/pull-scoped-resources.sh
      - task: format
    generates:
      - pkg/validator/namespace/resource_scope.go
      - pkg/validator/namespace/extra_resource_scope.go
