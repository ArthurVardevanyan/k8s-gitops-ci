# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  NAME: k8s-gitops-ci
  # renovate: datasource=go depName=golang.org/x/tools
  GOIMPORTS_VERSION: v0.49.0
  # renovate: datasource=go depName=mvdan.cc/gofumpt
  GOFUMPT_VERSION: v0.11.0
  # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
  GOLANGCI_LINT_VERSION: v2.12.2
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.7.0
  # TOOLS defaults to the in-repo .tool/ dir, but honors a
  # K8S_GITOPS_CI_TOOLS_DIR env override so CI can redirect the installed
  # Go tools (golangci-lint, govulncheck, gofumpt, goimports) onto a
  # persistent cache volume instead of the fresh-clone workspace — without
  # it, install-tools re-links all four every run because .tool/ starts
  # empty on each checkout.
  TOOLS: '{{.TOOLS | default (env "K8S_GITOPS_CI_TOOLS_DIR") | default (printf "%s/.tool" (.ROOT_DIR | toSlash)) }}'
  TOOLS_BIN: "{{.TOOLS}}"
  DIST: "{{.ROOT_DIR | toSlash}}/bin"
  PATH_SEP: "{{ if eq OS `windows` }};{{ else }}:{{ end }}"
  TOOLS_PATH: "{{.TOOLS_BIN}}{{.PATH_SEP}}{{.DIST}}"
  MAIN_PACKAGE: ./cmd/k8s-gitops-ci
  COVER: "{{.ROOT_DIR | toSlash}}/.task/cover"
  BUILD_COMMIT:
    sh: git rev-parse HEAD 2>/dev/null || echo nightly
  GIT_SHA:
    sh: git rev-parse --short=12 HEAD 2>/dev/null || echo unknown
  BUILD_VERSION:
    sh: |
      if [ -n "${BUILD_VERSION:-}" ]; then
        echo "${BUILD_VERSION}"
        exit 0
      fi
      # VERSION is the single source of truth for the version (see
      # docs/RELEASE.md): the release pipeline tags v${VERSION} when a merge
      # to main advances it. Local/dev builds append -local so they're never
      # mistaken for the released binary of that version (goreleaser injects
      # the real tag via .goreleaser.yaml's ldflags at release time).
      VERSION="$(tr -d '[:space:]' <VERSION 2>/dev/null)"
      if [ -z "${VERSION}" ]; then VERSION="0.0.1"; fi
      echo "${VERSION}-local"
  GIT_VERSION:
    sh: git describe --tags --always 2>/dev/null || echo dev
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.BuildVersion={{.BUILD_VERSION}}
    -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.BuildTime={{.BUILD_TIME}}
    -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.Commit={{.BUILD_COMMIT}}

env:
  CGO_ENABLED: "0"
  GOFLAGS: -mod=mod

# ── Info ──────────────────────────────────────────────────────────────────────
tasks:
  default:
    aliases: [info]
    silent: true
    desc: Display project information
    cmds:
      - |
        echo "------------------------------------------------------------"
        echo "{{.NAME}} Taskfile"
        echo "------------------------------------------------------------"
        echo "Common commands:"
        echo "  task           # this info"
        echo "  task ci        # full CI pipeline (lint + test + build)"
        echo "  task build     # build bin/k8s-gitops-ci"
        echo "  task test      # run tests"
        echo "  task lint      # run golangci-lint"
        echo "  task format    # auto-format Go sources"
        echo ""
        echo "  BUILD_VERSION: {{.BUILD_VERSION}}"
        echo "  BUILD_COMMIT:  {{.BUILD_COMMIT}}"
        echo "  GIT_SHA:       {{.GIT_SHA}}"
        echo "------------------------------------------------------------"

  # ── Version ───────────────────────────────────────────────────────────────────
  version:check:
    desc: Validate the VERSION file (semver; never behind the latest tag or main's VERSION)
    silent: true
    cmds:
      - |
        set -euo pipefail
        # VERSION is the single source of truth for releases: the pipeline
        # tags v${VERSION} when a merge to main advances it past the latest
        # tag (see docs/RELEASE.md). This guard runs in `task ci` so a
        # malformed, stale, or downgraded VERSION fails the PR instead of
        # surfacing only at release time.
        if [ ! -f VERSION ]; then
          echo "❌ VERSION file is missing"
          exit 1
        fi
        VERSION="$(tr -d '[:space:]' <VERSION)"
        if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "❌ VERSION '${VERSION}' is not valid MAJOR.MINOR.PATCH"
          exit 1
        fi

        # ge <a> <b>: true (0) iff a >= b, using version sort. Equal is
        # allowed everywhere below — only a strict *decrease* is rejected, so
        # ordinary non-release PRs (VERSION unchanged) always pass.
        ge() {
          [ "$1" = "$2" ] && return 0
          [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
        }

        # Resolve the base branch once, up front, so both Guard 1 and Guard 2
        # below can share it. Base ref defaults to origin/main but is
        # overridable via VERSION_CHECK_BASE_REF — the Tekton PR run fetches
        # the target branch and sets this to FETCH_HEAD (the clone otherwise
        # lacks origin/main). Best-effort: silently tolerates when the ref or
        # its VERSION file isn't resolvable (offline/local dev), but we must
        # still distinguish "resolved" from "unresolved" so Guard 1 can
        # fail-closed later.
        BASE_REF="${VERSION_CHECK_BASE_REF:-origin/main}"
        BASE_RESOLVED=0
        BASE_VERSION=""
        if git rev-parse --verify --quiet "${BASE_REF}" >/dev/null 2>&1; then
          BASE_RESOLVED=1
          BASE_VERSION="$(git show "${BASE_REF}:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
        fi

        # Did this PR actually modify VERSION relative to the base branch? Both
        # Guard 1 (behind latest tag) and Guard 2 (behind base) only exist to
        # reject a VERSION that was *downgraded*. A branch that simply never
        # touched VERSION (it predates a newer release on main) isn't downgrading
        # anything — the merge will inherit main's newer VERSION, so it must not
        # be blocked for being staler than the tip of main. We detect that with a
        # merge-base diff (three-dot) against the resolved base ref: absent =
        # untouched. Tri-state:
        #   no      — base resolved and VERSION unchanged → skip Guard 1 & 2
        #   yes     — base resolved and VERSION changed → Guards fully in force
        #   unknown — base unresolved OR the diff failed → fail-closed below
        # The diff is captured into a variable first (with its own status) so a
        # git error is distinguishable from an empty diff: we must NOT fall into
        # VERSION_TOUCHED=no on a git failure, or a broken diff would silently
        # disable both guards.
        VERSION_TOUCHED="unknown"
        if [ "${BASE_RESOLVED}" -eq 1 ]; then
          DIFF="$(git diff --name-only "${BASE_REF}...HEAD" 2>/dev/null)" || true
          if [ -z "${DIFF}" ]; then
            # Empty diff means base tip == HEAD (no PR changes at all). This is
            # a degenerate/forced state, not the "untouched but behind" case, so
            # treat it as changed and let the guards decide.
            VERSION_TOUCHED="yes"
          else
            if printf '%s\n' "${DIFF}" | grep -Fxq "VERSION"; then
              VERSION_TOUCHED="yes"
            else
              VERSION_TOUCHED="no"
            fi
          fi
        fi

        # Guard 1: VERSION must not be behind the latest existing release tag.
        # Skipped only when this PR provably didn't modify VERSION relative to
        # the base ref (see above); always enforced when VERSION was changed
        # or the base ref couldn't be resolved (fail-closed, preserving the
        # original behavior for offline/local runs and cleans upstream states).
        LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 | sed 's/^v//' || true)"
        if [ "${VERSION_TOUCHED}" != "no" ] \
          && [ -n "${LATEST}" ] && ! ge "${VERSION}" "${LATEST}"; then
          echo "❌ VERSION '${VERSION}' is behind the latest release tag 'v${LATEST}'"
          exit 1
        fi

        # Guard 2: VERSION must not be behind the base branch's current
        # VERSION (catches a downgrade that's still >= the latest tag, e.g.
        # reverting a bump that hasn't been tagged yet). Gated on
        # VERSION_TOUCHED just like Guard 1: an untouched VERSION on a branch
        # that predates a newer base VERSION isn't a downgrade and must pass;
        # only a PR that actually changes VERSION downward, or an
        # unresolvable/failed diff (fail-closed), may fail here. Best-effort:
        # silently skips when the base VERSION file isn't resolvable, so
        # offline/local dev keeps working.
        if [ "${VERSION_TOUCHED}" != "no" ] \
          && [ -n "${BASE_VERSION}" ] \
          && printf '%s' "${BASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
          && ! ge "${VERSION}" "${BASE_VERSION}"; then
          echo "❌ VERSION '${VERSION}' is behind ${BASE_REF}'s VERSION '${BASE_VERSION}' (downgrade)"
          exit 1
        fi

        # Guard 3: bump-correctness. When VERSION advances past the latest
        # tag (i.e. this PR is claiming a release), the size of the bump must
        # be at least what the change warrants — e.g. you can't ship a `feat:`
        # as a patch bump. Three sources contribute the "expected bump":
        #   1. PR_TITLE (preferred) — because PRs are squash-merged, the PR
        #      title *is* the squash commit's subject and so the change that
        #      actually lands on main (and drives the real post-merge git-cliff
        #      bump/changelog). Sizing from it is authoritative for a squash-
        #      merged repo; the branch's individual commits are discarded on
        #      squash and only reflect a draft's WIP history.
        #   2. PR branch commits — scans `base..HEAD` for conventional types,
        #      catching features from other merged PRs that the PR_TITLE
        #      (of a separate VERSION bump PR) can't see — works without
        #      git-cliff. Only raises WANT; never lowers it.
        #   3. the branch's conventional commits via git-cliff — retained so
        #      the check still covers non-squash/rebase workflows, and so an
        #      under-labeled PR title (`fix:` title hiding a `feat:` commit)
        #      can't slip a too-small VERSION through.
        # The required bump is the MAX of the three (whichever demands the
        # larger bump wins), compared against VERSION's own bump class. This
        # blocks UNDER-bumps only; over-bumps are allowed. PR_TITLE is read
        # from the environment (the Tekton PR run sets it from PAC), so local
        # dev without it falls back to the commit-based sizing (both branch-
        # commit and git-cliff arms). The branch-commit arm contributes bump
        # class 0 for non-release-relevant types (docs/chore/test/ci/build/...),
        # matching what git-cliff will size them as post-merge, so the three
        # never disagree spuriously. A malformed/non-conventional PR title
        # also sizes 0 here — format enforcement lives in the separate
        # conventional-PR-title CI check, not here.
        bump_class() {
          # class of $1 relative to LATEST: 3=major, 2=minor, 1=patch, 0=none
          old_major="${LATEST%%.*}"; rest="${LATEST#*.}"; old_minor="${rest%%.*}"
          new_major="${1%%.*}"; rest="${1#*.}"; new_minor="${rest%%.*}"
          if [ "${new_major}" != "${old_major}" ]; then echo 3
          elif [ "${new_minor}" != "${old_minor}" ]; then echo 2
          elif [ "$1" != "${LATEST}" ]; then echo 1
          else echo 0; fi
        }
        # title_bump_class <title> <new_major>: the bump class implied by a
        # conventional PR title alone, honoring cliff.toml's pre-1.0 rules —
        # on a 0.x target a breaking title bumps MINOR
        # ("breaking_always_bump_major = false"), not MAJOR; `feat:` (with or
        # without a scope) bumps minor; `fix:`/`perf:` (with or without a
        # scope) bump patch; everything else
        # (docs/chore/ci/build/refactor/style/test, unknown) contributes
        # nothing, matching git-cliff's post-merge sizing of those.
        #
        # Breaking detection follows the Conventional Commits spec: a trailing
        # `!` on the type (or scope) marks a breaking change for ANY type —
        # `feat!`, `feat(api)!`, `fix!`, `refactor(api)!`, ... — as does a
        # leading `BREAKING CHANGE:`. Extracting everything before the first
        # `:` (${1%%:*}) and testing whether it ends in `!` demands the `!`
        # terminate the type/scope, so a stray `!:` *inside the subject text*
        # (e.g. a description mentioning "!:" ) can never be mistaken for a
        # breaking marker. This mirrors git-cliff's own `conventional_commits`
        # interpretation, so the two arms never disagree on what is breaking.
        title_bump_class() {
          prefix="${1%%:*}"
          case "${prefix}" in
            # Breaking: trailing `!` on the type/scope, or `BREAKING CHANGE`.
            BREAKING\ CHANGE|*\!)
              [ "$2" = "0" ] && echo 2 || echo 3 ;;
            # Non-breaking types.
            *) case "$1" in
                 feat:*|feat\(*\):*) echo 2 ;;
                 fix:*|fix\(*\):*|perf:*|perf\(*\):*) echo 1 ;;
                 *) echo 0 ;;
               esac ;;
          esac
        }
        PR_TITLE="${PR_TITLE:-}"
        if [ -n "${LATEST}" ] && [ "${VERSION}" != "${LATEST}" ]; then
          GOT="$(bump_class "${VERSION}")"
          # Required class starts at 0 and only goes up; we only fail if the
          # actual VERSION bump is smaller than the max of the two sources.
          WANT=0
          REASON=""
          # PR-title arm: authoritative for squash-merges. The pre-1.0
          # breaking rule keys off the NEW version's major, so pass
          # ${VERSION%%.*} as title_bump_class's second argument.
          if [ -n "${PR_TITLE}" ]; then
            TITLE_WANT="$(title_bump_class "${PR_TITLE}" "${VERSION%%.*}")"
            if [ "${TITLE_WANT}" -gt "${WANT}" ]; then
              WANT="${TITLE_WANT}"
              REASON="PR title '${PR_TITLE}' warrants a $( [ "${TITLE_WANT}" = 2 ] && echo minor || { [ "${TITLE_WANT}" = 3 ] && echo major || echo patch; }) bump"
            fi
          fi
          # Branch-commit arm: scan commits on the PR branch for conventional
          # types. This catches features from other merged PRs that the
          # PR_TITLE (of a separate VERSION bump PR) can't see — works
          # without git-cliff. Only raises WANT; never lowers it. Falls
          # back to main if no base ref is set (local dev).
          BASE_REF_FOR_SCANNING="${VERSION_CHECK_BASE_REF:-origin/main}"
          if [ -n "${BASE_REF_FOR_SCANNING}" ] && command -v git >/dev/null 2>&1; then
            while IFS= read -r commit_msg; do
              [ -z "${commit_msg}" ] && continue
              COMMIT_WANT="$(title_bump_class "${commit_msg}" "${VERSION%%.*}")"
              if [ "${COMMIT_WANT}" -gt "${WANT}" ]; then
                WANT="${COMMIT_WANT}"
                REASON="branch commits since ${BASE_REF_FOR_SCANNING} warrant a $( [ "${COMMIT_WANT}" = 2 ] && echo minor || { [ "${COMMIT_WANT}" = 3 ] && echo major || echo patch; }) bump (max of PR title + branch commits)"
              fi
            done <<<"$(git log --format='%s' "${BASE_REF_FOR_SCANNING}..HEAD" 2>/dev/null || true)"
          fi
          # Commit arm: git-cliff (best-effort — skipped if not installed,
          # e.g. local dev). Only raises WANT; never lowers it.
          if command -v git-cliff >/dev/null 2>&1; then
            SUGGESTED="$(git-cliff --bumped-version --unreleased 2>/dev/null | sed 's/^v//' || true)"
            if printf '%s' "${SUGGESTED}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              COMMIT_WANT="$(bump_class "${SUGGESTED}")"
              if [ "${COMMIT_WANT}" -gt "${WANT}" ]; then
                WANT="${COMMIT_WANT}"
                REASON="the commits since v${LATEST} warrant a $( [ "${COMMIT_WANT}" = 2 ] && echo minor || { [ "${COMMIT_WANT}" = 3 ] && echo major || echo patch; }) bump (git-cliff suggests v${SUGGESTED})"
              fi
            fi
          fi
          if [ "${GOT}" -lt "${WANT}" ]; then
            echo "❌ VERSION '${VERSION}' under-bumps: ${REASON}. Bump VERSION to at least that."
            exit 1
          fi
        fi

        echo "✅ VERSION ${VERSION} is valid (latest tag: ${LATEST:+v}${LATEST:-<none>}, ${BASE_REF} VERSION: ${BASE_VERSION:-<n/a>})"

  # ── Modules ───────────────────────────────────────────────────────────────────
  mod:
    desc: Download and tidy Go modules
    silent: true
    sources:
      - go.mod
      - go.sum
    cmds:
      - go mod download
      - go mod tidy

  mod:check:
    desc: Ensure go.mod and go.sum are tidy without modifying the working tree
    silent: true
    cmds:
      - |
        set -e
        cp go.mod go.mod.bak
        cp go.sum go.sum.bak
        if ! go mod tidy 2>&1; then
          echo "❌ go mod tidy failed"
          mv go.mod.bak go.mod
          mv go.sum.bak go.sum
          exit 1
        fi
        if diff -q go.mod go.mod.bak > /dev/null 2>&1 && diff -q go.sum go.sum.bak > /dev/null 2>&1; then
          echo "✅ go.mod and go.sum are tidy"
          rm -f go.mod.bak go.sum.bak
          exit 0
        fi
        echo "❌ go.mod and go.sum need tidying"
        diff go.mod.bak go.mod || true
        mv go.mod.bak go.mod
        mv go.sum.bak go.sum
        echo "Run 'task mod' to fix."
        exit 1

  mod:verify:
    desc: Verify Go module integrity and checksums
    silent: true
    cmds:
      - go mod verify

  # ── Tool installation ─────────────────────────────────────────────────────────
  install-tools:
    desc: Install all Go development tools to .tool/
    silent: true
    deps: [install-tools:go]
    cmds:
      - echo "✅ All development tools installed"

  install-tools:go:
    desc: Install Go tooling (golangci-lint, govulncheck, gofumpt, goimports)
    silent: true
    run: once
    env:
      GOBIN: "{{.TOOLS_BIN}}"
      PATH: "{{.TOOLS_PATH}}:{{ env `PATH` }}"
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"
        mkdir -p "{{.TOOLS_BIN}}"
        install_tool() {
          # Reinstalls whenever the pinned version changes, not just when the
          # binary is missing — otherwise a stale local .tool/ cache silently
          # drifts from the version pinned here (see #105 gofumpt incident).
          local name="$1" pkg="$2" version="$3"
          local marker="{{.TOOLS_BIN}}/.${name}.version"
          if [[ ! -x "{{.TOOLS_BIN}}/$name" ]] || [[ "$(cat "$marker" 2>/dev/null)" != "$version" ]]; then
            echo "[install] $name@$version"
            go install "${pkg}@${version}"
            echo "$version" > "$marker"
          fi
        }
        install_tool golangci-lint "github.com/golangci/golangci-lint/v2/cmd/golangci-lint" "{{.GOLANGCI_LINT_VERSION}}"
        install_tool govulncheck   "golang.org/x/vuln/cmd/govulncheck" "{{.GOVULNCHECK_VERSION}}"
        install_tool gofumpt       "mvdan.cc/gofumpt" "{{.GOFUMPT_VERSION}}"
        install_tool goimports     "golang.org/x/tools/cmd/goimports" "{{.GOIMPORTS_VERSION}}"

  # ── Formatting ────────────────────────────────────────────────────────────────
  format:
    desc: Auto-format Go code (goimports + gofumpt) and tidy modules
    deps: [install-tools]
    silent: true
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - "{{.TOOLS_BIN}}/goimports"
      - "{{.TOOLS_BIN}}/gofumpt"
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"
        echo "Formatting Go files..."
        find . -type f -name '*.go' \
          -not -path './.cache/*' \
          -not -path './.task/*' \
          -not -path './.tool/*' \
          -not -path './vendor/*' \
          -print0 | xargs -0 goimports -w
        find . \
          -type d \( -name .cache -o -name .task -o -name .tool -o -name vendor \) -prune -false \
          -o -type f -name '*.go' -print \
          | xargs gofumpt -w -extra
        go mod tidy
        echo "✅ Formatting complete"

  format:check:
    desc: Check Go formatting without modifying files (fails if changes needed)
    deps: [install-tools]
    silent: true
    sources:
      - "**/*.go"
      - "{{.TOOLS_BIN}}/goimports"
      - "{{.TOOLS_BIN}}/gofumpt"
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"
        changes=0
        UNFORMATTED=$(find . \
          -type d \( -name .cache -o -name .task -o -name .tool -o -name vendor \) -prune -false \
          -o -type f -name '*.go' -print0 \
          | xargs -0 goimports -l 2>/dev/null || true)
        if [ -n "$UNFORMATTED" ]; then
          echo "❌ goimports issues:"
          echo "$UNFORMATTED"
          changes=1
        fi
        UNFORMATTED=$(find . \
          -type d \( -name .cache -o -name .task -o -name .tool -o -name vendor \) -prune -false \
          -o -type f -name '*.go' -print0 \
          | xargs -0 gofumpt -l -extra 2>/dev/null || true)
        if [ -n "$UNFORMATTED" ]; then
          echo "❌ gofumpt issues:"
          echo "$UNFORMATTED"
          changes=1
        fi
        if [ "$changes" -ne 0 ]; then
          echo "Run 'task format' to fix."
          exit 1
        fi
        echo "✅ Code formatting is correct"

  # ── Lint & static analysis ────────────────────────────────────────────────────
  lint:
    desc: Run golangci-lint
    aliases: [l]
    silent: true
    deps: [install-tools, schemas:pull, policies:pull]
    sources:
      - "./**/*.go"
      - .golangci.yml
      - "{{.TOOLS_BIN}}/golangci-lint"
    cmds:
      - |
        set -e
        export PATH="{{.TOOLS_PATH}}:$PATH"
        echo "Running golangci-lint..."
        golangci-lint run ./... --config .golangci.yml --timeout 5m0s
        echo "✅ No linting issues found"

  vet:
    desc: Run go vet
    silent: true
    sources:
      - "./**/*.go"
      - go.mod
      - go.sum
    cmds:
      - go vet ./...

  # ── Security ──────────────────────────────────────────────────────────────────
  vulncheck:
    desc: Check for known vulnerabilities (only fails on fixable findings)
    silent: true
    deps: [install-tools, schemas:pull, policies:pull]
    cmds:
      - |
        export PATH="{{.TOOLS_PATH}}:$PATH"
        OUTPUT=$(govulncheck -format json ./...)
        if echo "$OUTPUT" | grep -q '"fixed_version"'; then
          echo "ERROR: fixable vulnerabilities found:"
          govulncheck ./... || true
          exit 1
        fi
        if echo "$OUTPUT" | grep -q '"finding"'; then
          echo "WARNING: unfixable vulnerabilities (no patch available):"
          echo "$OUTPUT" | grep -o '"osv": "[^"]*"' | sort -u | sed 's/^/  /'
        else
          echo "✅ No vulnerabilities found"
        fi

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    desc: Build bin/{{.NAME}}
    silent: true
    deps: [schemas:pull, policies:pull]
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      # schemas:pull/policies:pull have no `sources:` of their own (they
      # always re-run to keep the pinned-SHA fetch honest), so without these
      # two lines Task's up-to-date check never notices a freshly-regenerated
      # archive - the go:embed'd content silently changes underneath a build
      # Task still considers "up to date" from the go-file fingerprint alone.
      - pkg/lint/kubeconform/schemas/schemas.tar.gz
      - pkg/lint/kyverno/policies/policies.tar.gz
    generates:
      - "{{.DIST}}/{{.NAME}}"
    cmds:
      - mkdir -p {{.DIST}}
      - >
        go build
        -tags embedschemas
        -ldflags '-w {{.LDFLAGS}}'
        -trimpath
        -o {{.DIST}}/{{.NAME}}
        {{.MAIN_PACKAGE}}

  # image:build and image:publish are commented out until the registry is wired up.
  # image:build:
  #   desc: Build and push container image with ko
  #   env:
  #     KO_DOCKER_REPO: '{{.KO_DOCKER_REPO | default "registry.arthurvardevanyan.com/homelab/k8s-gitops-ci"}}'
  #     BUILD_VERSION: "{{.BUILD_VERSION}}"
  #     BUILD_COMMIT: "{{.BUILD_COMMIT}}"
  #   cmds:
  #     - ko build {{.MAIN_PACKAGE}} --bare --sbom=none --tags={{.KO_TAGS | default "local"}}
  #
  # image:publish:
  #   desc: Build+push image and write .image-tag / .image-ref / .image-digest
  #   env:
  #     KO_DOCKER_REPO: '{{.KO_DOCKER_REPO | default "registry.arthurvardevanyan.com/homelab/k8s-gitops-ci"}}'
  #   cmds:
  #     - |
  #       ... (see upstream image:publish for full logic)

  # ── Testing ───────────────────────────────────────────────────────────────────
  test:
    desc: Run test suite
    aliases: [t]
    deps: [schemas:pull, policies:pull]
    env:
      # Default matches the top-level `env:` block's GOFLAGS (task-level env
      # fully replaces it, not merges) rather than forcing `-count=1` — the
      # latter defeated Go's own test-result cache on every run, even for
      # packages untouched since the last pass. Still overridable, e.g.
      # `task test GOFLAGS=-count=1` to force a full rerun.
      GOFLAGS: '{{.GOFLAGS | default "-mod=mod"}}'
      # No `-shuffle=on` default: it's not in `go test`'s cacheable-flag
      # set (see `go help test`), so passing it at all disables Go's test
      # result cache unconditionally - combined with the GOFLAGS change
      # above, this is what actually lets unchanged packages skip re-running
      # entirely. Still available via `task test GOTESTFLAGS=-shuffle=on`
      # to catch inter-test order dependencies on demand.
      GOTESTFLAGS: '{{.GOTESTFLAGS | default ""}}'
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      # See build's matching comment: without these, a regenerated archive
      # (e.g. after bumping SCHEMA_REPO_SHA) won't re-trigger `go test`.
      - pkg/lint/kubeconform/schemas/schemas.tar.gz
      - pkg/lint/kyverno/policies/policies.tar.gz
    cmds:
      - go test -tags embedschemas $GOTESTFLAGS -timeout 10m ./...

  test:cover:
    desc: Run tests with coverage profile + race detector
    silent: true
    deps: [schemas:pull, policies:pull]
    env:
      # See test's matching comment: default no longer forces `-count=1`,
      # so unchanged packages can reuse Go's cached test results.
      GOFLAGS: '{{.GOFLAGS | default "-mod=mod"}}'
      # See test's matching comment: no `-shuffle=on` default either, for
      # the same test-cache reason.
      GOTESTFLAGS: '{{.GOTESTFLAGS | default ""}}'
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      # See build's matching comment: without these, a regenerated archive
      # (e.g. after bumping SCHEMA_REPO_SHA) won't re-trigger `go test`.
      - pkg/lint/kubeconform/schemas/schemas.tar.gz
      - pkg/lint/kyverno/policies/policies.tar.gz
    cmds:
      - mkdir -p {{.COVER}}
      # CGO_ENABLED=1 set inline — the global CGO_ENABLED=0 is exported into
      # subprocesses and task-level env won't override it there.
      - CGO_ENABLED=1 go test -tags embedschemas $GOTESTFLAGS -race -covermode=atomic -coverprofile={{.COVER}}/cover.out -timeout 10m ./...

  test:race:
    desc: Alias for test:cover (race detector runs there)
    cmds:
      - task: test:cover

  test:homelab-prs:
    desc: Replay the last N merged PRs of a real GitOps repo (default HomeLab)
    silent: true
    deps: [build]
    vars:
      COUNT: '{{.COUNT | default "15"}}'
      PARALLEL: '{{.PARALLEL | default "5"}}'
      REPOS: '{{.REPOS | default "ArthurVardevanyan/HomeLab"}}'
      OUTPUT: '{{.OUTPUT | default ""}}'
    cmds:
      - >
        ./scripts/test-homelab-prs.sh
        --binary "{{.DIST}}/{{.NAME}}"
        --count "{{.COUNT}}"
        --parallel "{{.PARALLEL}}"
        --repos "{{.REPOS}}"
        {{if .OUTPUT}}--output "{{.OUTPUT}}"{{end}}

  coverage:report:
    desc: Print per-file coverage report
    silent: true
    deps: [test:cover]
    cmds:
      - go tool cover -func={{.COVER}}/cover.out

  coverage:html:
    desc: Generate HTML coverage report and open in browser
    silent: true
    deps: [test:cover]
    cmds:
      - go tool cover -html={{.COVER}}/cover.out -o {{.COVER}}/coverage.html
      - |
        echo "✅ HTML report: {{.COVER}}/coverage.html"
        if command -v xdg-open >/dev/null 2>&1; then xdg-open {{.COVER}}/coverage.html
        elif command -v open >/dev/null 2>&1; then open {{.COVER}}/coverage.html; fi

  # ── Full CI pipeline ──────────────────────────────────────────────────────────
  ci:
    desc: Full CI pipeline — version, mod check, format, schemas, lint, vulncheck, test, build
    silent: true
    vars:
      # Suffixed with the shell PID so concurrent/overlapping `task ci` runs
      # (e.g. a local run overlapping a CI run, or a retried pipeline step)
      # never truncate or interleave-write into the same timing file.
      CI_TIMEFILE_DEFAULT:
        sh: echo "{{.ROOT_DIR | toSlash}}/.task/ci-timings.$$"
      TIMEFILE: "{{.TIMEFILE | default .CI_TIMEFILE_DEFAULT}}"
    cmds:
      # Native `- task:` references preserve the Taskfile env (CGO_ENABLED, etc.)
      # across steps. Timing markers are appended to TIMEFILE and diffed at the end.
      - |
        set -euo pipefail
        mkdir -p "$(dirname "{{.TIMEFILE}}")"
        : > "{{.TIMEFILE}}"
        printf '%s\t%s\n' "$(date +%s.%N)" "START" >> "{{.TIMEFILE}}"
        echo "=========================================="
        echo "🚀 Starting CI Pipeline"
        echo "=========================================="
        echo ""
        echo "▶ Step 1/8  Version Check"
      - task: version:check
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 1/8  Version Check" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 2/8  Module Dependencies Check"
      - task: mod:check
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 2/8  Module Dependencies Check" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 3/8  Code Formatting Check"
      - task: format:check
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 3/8  Code Formatting Check" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 4/8  Schemas & Policies"
      - task: schemas:pull
      - task: policies:pull
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 4/8  Schemas & Policies" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 5/8  Linting"
      - task: lint
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 5/8  Linting" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 6/8  Vulnerability Check"
      - task: vulncheck
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 6/8  Vulnerability Check" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 7/8  Tests (coverage + race)"
      - task: test:cover
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 7/8  Tests (coverage + race)" >> "{{.TIMEFILE}}"
      - echo "" && echo "▶ Step 8/8  Build"
      - task: build
      - printf '%s\t%s\n' "$(date +%s.%N)" "Step 8/8  Build" >> "{{.TIMEFILE}}"
      - |
        set -euo pipefail
        echo ""
        echo "=========================================="
        echo "✅ CI Pipeline Completed Successfully!"
        echo "=========================================="
        echo "⏱  Step timings (wall time):"
        awk -F'\t' '
          NR == 1 { prev = $1; next }
          {
            secs = $1 - prev
            total += secs
            printf "   %-38s %7.1fs\n", $2, secs
            prev = $1
          }
          END { printf "   %-38s %7.1fs\n", "TOTAL", total }
        ' "{{.TIMEFILE}}"
        echo "=========================================="
        rm -f "{{.TIMEFILE}}"

  # ── Clean ─────────────────────────────────────────────────────────────────────
  clean:
    desc: Remove build artifacts, caches, and temp files
    silent: true
    cmds:
      - |
        echo "🧹 Cleaning..."
        rm -rf bin/ dist/ .task/ .tool/
        find . -name "*.tmp" -type f -delete
        find . -name ".DS_Store" -type f -delete
        echo "✅ Clean complete"

  # ── Dependencies ──────────────────────────────────────────────────────────────
  update:deps:
    desc: Upgrade all Go dependencies and tidy go.mod/go.sum
    silent: true
    cmds:
      - |
        set -euo pipefail
        echo "🔍 Updating Go dependencies..."
        go get -u ./...
        go mod tidy
        echo "✅ Dependencies updated — run 'task test' to verify"

  update:
    desc: Run all update tasks (deps, schemas/policies pin bump + repack, scoped-resources)
    silent: true
    cmds:
      - task: update:deps
      # Bump the pins first, then repack the archives from the new pins so
      # `task update` leaves both the pinned SHA and the on-disk archive in
      # sync (update:schemas/update:policies only rewrite the pin).
      - task: update:schemas
      - task: update:policies
      - task: schemas:pull
      - task: policies:pull
      - task: update:scoped-resources

  schemas:pull:
    desc: Pull embedded kubeconform schemas from git (repacks schemas.tar.gz from the pinned SCHEMA_REPO_SHA)
    cmds:
      - scripts/pull-schemas.sh
    generates:
      - pkg/lint/kubeconform/schemas/schemas.tar.gz

  policies:pull:
    desc: Pull embedded kyverno policies (placeholder) into policies.tar.gz
    cmds:
      - scripts/pull-policies.sh
    generates:
      - pkg/lint/kyverno/policies/policies.tar.gz

  update:schemas:
    desc: Bump the pinned SCHEMA_REPO_SHA in scripts/pull-schemas.sh to the SCHEMA_REPO_BRANCH tip
    silent: true
    cmds:
      # Only rewrites the pinned SHA in scripts/pull-schemas.sh - it does
      # NOT repack schemas.tar.gz. Producing the archive from whatever
      # SCHEMA_REPO_SHA is pinned is `schemas:pull`'s job (a dep of
      # build/test/lint/vulncheck), so the flow is:
      #   task update:schemas   # bump the pin (this task)
      #   task schemas:pull     # repack the archive from the new pin
      # Renovate performs the same bump automatically via the git-refs
      # customManager in renovate.json that tracks the pinned line.
      - |
        set -euo pipefail
        : "${SCHEMA_REPO:=https://github.com/ArthurVardevanyan/kubernetes-json-schema}"
        : "${SCHEMA_REPO_BRANCH:=main}"
        SCRIPT="scripts/pull-schemas.sh"

        echo "🔍 Checking ${SCHEMA_REPO_BRANCH} tip of ${SCHEMA_REPO}..."

        LOCAL_SHA=$(sed -n 's/.*SCHEMA_REPO_SHA:=\([0-9a-f]\{40\}\)}.*/\1/p' "${SCRIPT}" | head -1)
        if [ -z "${LOCAL_SHA}" ]; then
          echo "❌ Could not find a pinned SCHEMA_REPO_SHA in ${SCRIPT}"
          exit 1
        fi
        echo "   Local:  ${LOCAL_SHA}"

        LATEST_SHA=$(git ls-remote "${SCHEMA_REPO}" "${SCHEMA_REPO_BRANCH}" | awk 'NR==1 {print $1}')
        if ! printf '%s' "${LATEST_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "❌ Could not resolve ${SCHEMA_REPO_BRANCH} tip from ${SCHEMA_REPO} (got: '${LATEST_SHA}')"
          exit 1
        fi

        if [ "${LATEST_SHA}" = "${LOCAL_SHA}" ]; then
          echo "✅ Already up to date (${LOCAL_SHA})"
          exit 0
        fi

        echo "⬆️  Updating ${LOCAL_SHA} → ${LATEST_SHA}"
        sed -i.bak "s/SCHEMA_REPO_SHA:=${LOCAL_SHA}}/SCHEMA_REPO_SHA:=${LATEST_SHA}}/" "${SCRIPT}" && rm -f "${SCRIPT}.bak"
        # Verify the substitution actually landed: sed exits 0 even when it
        # matches nothing, so re-read the pin and confirm it's now LATEST_SHA
        # rather than trusting sed's exit status (guards against the pinned-
        # line format drifting out from under the pattern above).
        NEW_LOCAL_SHA=$(sed -n 's/.*SCHEMA_REPO_SHA:=\([0-9a-f]\{40\}\)}.*/\1/p' "${SCRIPT}" | head -1)
        if [ "${NEW_LOCAL_SHA}" != "${LATEST_SHA}" ]; then
          echo "❌ Failed to update SCHEMA_REPO_SHA in ${SCRIPT} (still '${NEW_LOCAL_SHA:-<none>}')"
          echo "   The pinned-SHA line format may have changed; update this task's sed pattern."
          exit 1
        fi
        echo "   ✓ ${SCRIPT}"
        echo "✅ Bumped SCHEMA_REPO_SHA to ${LATEST_SHA}"
        echo "   Run 'task schemas:pull && task test' to verify, then commit."

  update:policies:
    desc: Bump the pinned policy ref in scripts/pull-policies.sh (no-op while policies are a static placeholder)
    silent: true
    cmds:
      # Mirror of update:schemas, but policies are currently a static
      # placeholder (PLACEHOLDER_REF in scripts/pull-policies.sh - there is
      # no upstream repo to `git ls-remote` yet), so there is nothing to
      # resolve or rewrite. Wire POLICY_REPO/POLICY_REPO_BRANCH resolution
      # in here (identical to update:schemas) once policies are pulled from
      # a real source. `policies:pull` still repacks the placeholder
      # archive as a dep of build/test/lint/vulncheck.
      - |
        set -euo pipefail
        : "${POLICY_REPO:=}"
        if [ -z "${POLICY_REPO}" ]; then
          echo "ℹ️  Policies are a static placeholder — no upstream ref to bump."
          echo "   (Set POLICY_REPO/POLICY_REPO_BRANCH here once a real policy source exists; see docs/SCHEMAS.md.)"
          exit 0
        fi
        echo "❌ POLICY_REPO resolution is not implemented yet; wire it up like update:schemas."
        exit 1

  update:scoped-resources:
    desc: Regenerate resource scope maps from kubectl api-resources
    cmds:
      - scripts/pull-scoped-resources.sh
      - task: format
    generates:
      - pkg/validator/namespace/resource_scope.go
      - pkg/validator/namespace/extra_resource_scope.go
