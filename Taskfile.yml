version: '3'

vars:
  BIN: gitops-ci
  GIT_VERSION:
    sh: git describe --tags --always 2>/dev/null || echo dev
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.BuildVersion={{.GIT_VERSION}}
    -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.BuildTime={{.BUILD_TIME}}
    -X github.com/ArthurVardevanyan/k8s-gitops-ci/cmd/version.Commit={{.GIT_COMMIT}}

env:
  GOFLAGS: -mod=mod

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Build the CLI binary to bin/gitops-ci
    cmds:
      - mkdir -p bin
      - go build -ldflags "{{.LDFLAGS}}" -o bin/{{.BIN}} ./cmd/{{.BIN}}
    generates:
      - bin/{{.BIN}}

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run ./...

  format:
    desc: Format sources
    cmds:
      - gofumpt -w .
      - goimports -w .

  update:deps:
    desc: Upgrade all Go dependencies and tidy go.mod/go.sum
    cmds:
      - go get -u ./...
      - go mod tidy

  update:
    desc: Run all update tasks (deps, schemas, policies, scoped-resources)
    cmds:
      - task: update:deps
      - task: update:schemas
      - task: update:policies
      - task: update:scoped-resources

  update:schemas:
    desc: Pull embedded kubeconform schemas from git
    cmds:
      - scripts/pull-schemas.sh
    generates:
      - pkg/lint/kubeconform/schemas/schemas.tar.gz

  update:policies:
    desc: Pull embedded kyverno policies
    cmds:
      - scripts/pull-policies.sh
    generates:
      - pkg/lint/kyverno/policies/policies.tar.gz

  update:scoped-resources:
    desc: Regenerate resource scope maps
    cmds:
      - scripts/pull-scoped-resources.sh
    generates:
      - pkg/validator/namespace/resource_scope.go
      - pkg/validator/namespace/extra_resource_scope.go
