apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: gitops-ci-pull-request
  annotations:
    pipelinesascode.tekton.dev/on-event: '[pull_request]'
    pipelinesascode.tekton.dev/on-target-branch: '[main]'
    pipelinesascode.tekton.dev/task: '[git-clone, gitops-ci]'
spec:
  pipelineRef:
    name: gitops-ci
  params:
    - name: repo-url
      value: '{{repo_url}}'
    - name: pr-number
      value: '{{pull_request_number}}'
    - name: revision
      value: '{{revision}}'
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
