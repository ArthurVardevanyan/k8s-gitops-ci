---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: k8s-gitops-ci-image
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: |
      (event == "pull_request" || event == "push") && target_branch == "main"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/max-concurrency: "1"
    pipelinesascode.tekton.dev/target-namespace: "k8s-gitops-ci"
    pipelinesascode.tekton.dev/task: "https://raw.githubusercontent.com/ArthurVardevanyan/HomeLab/main/tekton/tasks/git-clone/0.9.1/git-clone.yaml"
    pipelinesascode.tekton.dev/task-1: "https://raw.githubusercontent.com/ArthurVardevanyan/HomeLab/main/tekton/tasks/buildah/0.8.0/buildah.yaml"
    pipelinesascode.tekton.dev/task-2: "https://raw.githubusercontent.com/ArthurVardevanyan/HomeLab/main/tekton/base/clair-action/clair-action-task.yaml"
spec:
  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-commit
      value: "{{ revision }}"
    - name: pull-request-number
      value: "{{ pull_request_number }}"
    - name: event
      value: "{{ event_type }}"
    - name: target-branch
      value: "{{ target_branch }}"
    - name: IMAGE
      value: "registry.arthurvardevanyan.com/homelab/k8s-gitops-ci"
    - name: IMAGE_TAG
      value: ""
  pipelineSpec:
    params:
      - name: git-url
        type: string
      - name: git-commit
        type: string
      - name: pull-request-number
        type: string
        default: ""
      - name: event
        type: string
      - name: target-branch
        type: string
      - name: IMAGE
        type: string
        default: "registry.arthurvardevanyan.com/homelab/k8s-gitops-ci"
      - name: IMAGE_TAG
        type: string
        default: ""
    workspaces:
      - name: data
      - name: git_auth_secret
      - name: docker-config
        optional: true
    tasks:
      - name: resolve-image-tag
        runAfter: []
        params:
          - name: pull-request-number
            value: $(params.pull-request-number)
          - name: event
            value: $(params.event)
          - name: target-branch
            value: $(params.target-branch)
        taskSpec:
          params:
            - name: pull-request-number
              type: string
              default: ""
            - name: event
              type: string
            - name: target-branch
              type: string
          results:
            - name: IMAGE_TAG
              description: The computed image tag for this pipeline run
          volumes:
            - name: tmp
              emptyDir: {}
          stepTemplate:
            name: stepTemplate
            env:
              - name: PARAM_PR_NUMBER
                value: $(params.pull-request-number)
              - name: PARAM_EVENT
                value: $(params.event)
              - name: PARAM_TARGET_BRANCH
                value: $(params.target-branch)
          steps:
            - name: resolve-tag
              image: registry.arthurvardevanyan.com/homelab/toolbox:not_latest
              env:
                - name: PARAM_PR_NUMBER
                  value: $(params.pull-request-number)
                - name: PARAM_EVENT
                  value: $(params.event)
                - name: PARAM_TARGET_BRANCH
                  value: $(params.target-branch)
                - name: PARAM_IMAGE
                  value: $(params.IMAGE)
                - name: PARAM_IMAGE_TAG
                  value: $(params.IMAGE_TAG)
              script: |
                #!/usr/bin/env sh
                set -eu

                : "${PARAM_PR_NUMBER:=""}"
                : "${PARAM_EVENT:=""}"
                : "${PARAM_TARGET_BRANCH:=""}"
                : "${PARAM_IMAGE:=""}"
                : "${PARAM_IMAGE_TAG:=""}"

                if [ "${PARAM_EVENT}" = "pull_request" ]; then
                  echo "Computing PR tag: pr-${PARAM_PR_NUMBER}"
                  echo -n "pr-${PARAM_PR_NUMBER}" > "$(results.IMAGE_TAG.path)"
                else
                  if [ -n "${PARAM_IMAGE_TAG}" ]; then
                    echo "Using explicit image tag: ${PARAM_IMAGE_TAG}"
                    echo -n "${PARAM_IMAGE_TAG}" > "$(results.IMAGE_TAG.path)"
                  else
                    echo "Computing push tag: main"
                    echo -n "main" > "$(results.IMAGE_TAG.path)"
                  fi
                fi

      - name: git-clone
        taskRef:
          name: git-clone
          kind: Task
        params:
          - name: url
            value: $(params.git-url)
          - name: revision
            value: $(params.git-commit)
        workspaces:
          - name: output
            workspace: data
          - name: basic-auth
            workspace: git_auth_secret

      - name: buildah
        runAfter:
          - git-clone
        workspaces:
          - name: source
            workspace: data
          - name: dockerconfig
            workspace: docker-config
        params:
          - name: IMAGE
            value: "$(params.IMAGE):$(tasks.resolve-image-tag.results.IMAGE_TAG)"
          - name: IMAGE_REPOSITORIES
            value: "registry.arthurvardevanyan.com/homelab/k8s-gitops-ci,ghcr.io/ArthurVardevanyan/k8s-gitops-ci"
          - name: PLATFORMS
            value: "linux/amd64,linux/arm64"
          - name: DOCKERFILE
            value: "./Containerfile"
          - name: CONTEXT
            value: "."
          - name: FORMAT
            value: "oci"
          - name: TLSVERIFY
            value: "false"
          - name: STORAGE_DRIVER
            value: "overlay"
        taskRef:
          name: buildah
          kind: Task

      - name: clair-action
        runAfter:
          - buildah
        taskRef:
          name: clair-action
          kind: Task
        params:
          - name: IMAGE
            value: "$(tasks.buildah.results.IMAGE_URL)"

  taskRunTemplate:
    serviceAccountName: pipeline
  workspaces:
    - name: data
      volumeClaimTemplate:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: k8s-gitops-ci-image-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 500Mi
          storageClassName: rook-ceph-block-ci
    - name: git_auth_secret
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: docker-config
      secret:
        secretName: "k8s-gitops-ci-push-pull-secret"
