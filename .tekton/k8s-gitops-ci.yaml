---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: k8s-gitops-ci
  annotations:
    io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: "true"
    pipelinesascode.tekton.dev/on-cel-expression: |
      (event == "pull_request" || event == "push") && target_branch == "main"
    pipelinesascode.tekton.dev/max-concurrency: "1"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/target-namespace: "k8s-gitops-ci"
    pipelinesascode.tekton.dev/task: "https://raw.githubusercontent.com/ArthurVardevanyan/HomeLab/main/tekton/tasks/git-clone/0.9.1/git-clone.yaml"
    pipelinesascode.tekton.dev/task-1: "https://raw.githubusercontent.com/ArthurVardevanyan/HomeLab/main/tekton/base/clair-action/clair-action-task.yaml"
spec:
  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-commit
      value: "{{ revision }}"
    - name: pull-request-number
      value: "{{ pull_request_number }}"
    - name: event
      value: "{{ event_type }}"
  pipelineSpec:
    params:
      - name: git-url
        type: string
      - name: git-commit
        type: string
      - name: pull-request-number
        type: string
        default: ""
      - name: event
        type: string
    results:
      - name: SCAN_OUTPUT
        description: CVE scan result (placeholder until clair is re-enabled)
        value: ""
    workspaces:
      - name: data
      - name: git_auth_secret
      - name: go-cache
        optional: true
    tasks:
      - name: git-clone
        taskRef:
          name: git-clone
          kind: Task
        params:
          - name: url
            value: $(params.git-url)
          - name: revision
            value: $(params.git-commit)
          - name: depth
            value: "0"
        workspaces:
          - name: output
            workspace: data
          - name: basic-auth
            workspace: git_auth_secret

      - name: build
        runAfter:
          - git-clone
        workspaces:
          - name: output
            workspace: data
          - name: basic-auth
            workspace: git_auth_secret
          - name: go-cache
            workspace: go-cache
        params:
          - name: revision
            value: $(params.git-commit)
          - name: pull-request-number
            value: $(params.pull-request-number)
          - name: event
            value: $(params.event)
        taskSpec:
          params:
            - name: revision
              type: string
            - name: pull-request-number
              type: string
              default: ""
            - name: event
              type: string
          results: []
          workspaces:
            - name: output
            - name: basic-auth
            - name: go-cache
              optional: true
          volumes:
            - name: home
              emptyDir: {}
            # go-cache workspace provides GOMODCACHE/GOCACHE when bound;
            # these emptyDir fallbacks are used when it is not.
            - name: go-mod-fallback
              emptyDir: {}
            - name: go-build-fallback
              emptyDir: {}
          stepTemplate:
            name: stepTemplate
            env:
              - name: HOME
                value: /home/default
              # Go cache defaults — overridden by the cache-setup script
              # when the go-cache workspace is bound.
              - name: GOMODCACHE
                value: /home/default/.cache/go-mod
              - name: GOCACHE
                value: /home/default/.cache/go-build
              - name: GOLANGCI_LINT_CACHE
                value: /home/default/.cache/golangci-lint
              - name: XDG_CACHE_HOME
                value: /home/default/.cache
              - name: GO_CACHE_BOUND
                value: $(workspaces.go-cache.bound)
              - name: GO_CACHE_PATH
                value: $(workspaces.go-cache.path)
            volumeMounts:
              - name: home
                mountPath: /home/default
              - name: go-mod-fallback
                mountPath: /home/default/.cache/go-mod
              - name: go-build-fallback
                mountPath: /home/default/.cache/go-build
            computeResources:
              requests:
                cpu: 500m
                memory: 500Mi
                ephemeral-storage: 100Mi
              limits:
                cpu: "4"
                memory: 5Gi
                ephemeral-storage: 500Mi
            securityContext:
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
          steps:
            - name: build
              image: registry.arthurvardevanyan.com/homelab/toolbox:not_latest
              env:
                - name: PARAM_REVISION
                  value: $(params.revision)
                - name: PARAM_PR_NUMBER
                  value: $(params.pull-request-number)
                - name: PARAM_EVENT
                  value: $(params.event)
                - name: AUTH_PATH
                  value: $(workspaces.basic-auth.path)
              script: |
                #!/bin/bash
                set -o errexit
                set -o nounset
                set -o pipefail

                # Declare Tekton-injected env vars for shellcheck
                : "${PARAM_REVISION:=""}"
                : "${PARAM_PR_NUMBER:=""}"
                : "${PARAM_EVENT:=""}"
                : "${AUTH_PATH:=""}"
                : "${GO_CACHE_BOUND:=""}"
                : "${GO_CACHE_PATH:=""}"

                # ── Go caches ──────────────────────────────────────────────────
                # When the optional go-cache workspace is bound, redirect every
                # Go cache to the persistent PVC (module cache, build cache,
                # golangci-lint cache, XDG cache for schemas/policies). When
                # absent the stepTemplate env defaults keep caches on the local
                # emptyDir home volume — cold but self-contained.
                if [[ "${GO_CACHE_BOUND}" == "true" ]]; then
                  export GOMODCACHE="${GO_CACHE_PATH}/mod"
                  export GOCACHE="${GO_CACHE_PATH}/go-build"
                  export GOLANGCI_LINT_CACHE="${GO_CACHE_PATH}/golangci-lint"
                  export XDG_CACHE_HOME="${GO_CACHE_PATH}/.cache"
                  mkdir -p "${GOMODCACHE}" "${GOCACHE}" "${GOLANGCI_LINT_CACHE}" "${XDG_CACHE_HOME}"
                  echo "Using persistent Go caches under: ${GO_CACHE_PATH}"
                fi

                cd "$(workspaces.output.path)"
                git config --global --add safe.directory "$(workspaces.output.path)"
                git fetch --tags --force

                gh auth login --hostname "github.com" \
                  --with-token <"${AUTH_PATH}/git-provider-token"
                GITHUB_TOKEN=$(cat "${AUTH_PATH}/git-provider-token")
                export GITHUB_TOKEN

                echo "Running CI pipeline..."
                task ci

                # TODO: image build and push
                # if [ "${PARAM_EVENT}" = "push" ]; then
                #   NEW_SEMVER=$(git-cliff --bumped-version)
                #   echo "Releasing ${NEW_SEMVER}..."
                #   GORELEASER_CURRENT_TAG="${NEW_SEMVER}" goreleaser release --clean
                # else
                #   SHA_SHORT="${PARAM_REVISION:0:7}"
                #   TAG="$(date -u +%Y%m%d%H%M%S)-pr-${PARAM_PR_NUMBER}-${SHA_SHORT}"
                #   GORELEASER_CURRENT_TAG="${TAG}" goreleaser release --snapshot --clean
                # fi
                #
                # IMAGE=$(jq -r \
                #   '.[] | select(.type == "Docker Image") | select(.goos == "linux") | select(.goarch == "amd64") | .name' \
                #   dist/artifacts.json | head -1)
                # echo "Image: ${IMAGE}"
                # printf '%s' "${IMAGE}" > "$(results.IMAGE.path)"

      # TODO: clair scan (re-enable once image build is wired up)
      # - name: clair-action
      #   runAfter:
      #     - build
      #   taskRef:
      #     name: clair-action
      #     kind: Task
      #   params:
      #     - name: IMAGE
      #       value: $(tasks.build.results.IMAGE)

  taskRunTemplate:
    serviceAccountName: pipeline
    podTemplate:
      runtimeClassName: selinux
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
  workspaces:
    - name: data
      volumeClaimTemplate:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: "1Gi"
          storageClassName: rook-ceph-block-ci
    - name: git_auth_secret
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: go-cache
      persistentVolumeClaim:
        claimName: go-cache
