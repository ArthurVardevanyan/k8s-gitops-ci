---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: k8s-gitops-ci
  annotations:
    io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: "true"
    # The toolbox image is deliberately floating (Renovate-updated, not
    # git-tracked per-digest) - both the `build` and `lint` steps below use
    # it. See docs/EXEMPTIONS.md's annotation-exemption mode.
    gitops-ci.k8s.io/exempt-image-checksum: "registry.arthurvardevanyan.com/homelab/toolbox:not_latest"
    pipelinesascode.tekton.dev/on-cel-expression: |
      (event == "pull_request" || event == "push") && target_branch == "main"
    pipelinesascode.tekton.dev/max-concurrency: "1"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/target-namespace: "k8s-gitops-ci"
    pipelinesascode.tekton.dev/task-1: "https://raw.githubusercontent.com/ArthurVardevanyan/HomeLab/main/tekton/base/clair-action/clair-action-task.yaml"
spec:
  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-commit
      value: "{{ revision }}"
    - name: pull-request-number
      value: "{{ pull_request_number }}"
    - name: pull-request-title
      value: "{{ pull_request_title }}"
    - name: event
      value: "{{ event_type }}"
    - name: target-branch
      value: "{{ target_branch }}"
  pipelineSpec:
    params:
      - name: git-url
        type: string
      - name: git-commit
        type: string
      - name: pull-request-number
        type: string
        default: ""
      - name: pull-request-title
        type: string
        default: ""
      - name: event
        type: string
      - name: target-branch
        type: string
    workspaces:
      - name: git_auth_secret
      - name: go-cache
        optional: true
    tasks:
      - name: build
        workspaces:
          - name: basic-auth
            workspace: git_auth_secret
          - name: go-cache
            workspace: go-cache
        params:
          - name: git-url
            value: $(params.git-url)
          - name: revision
            value: $(params.git-commit)
          - name: pull-request-number
            value: $(params.pull-request-number)
          - name: pull-request-title
            value: $(params.pull-request-title)
          - name: event
            value: $(params.event)
          - name: target-branch
            value: $(params.target-branch)
        taskSpec:
          params:
            - name: git-url
              type: string
            - name: revision
              type: string
            - name: pull-request-number
              type: string
              default: ""
            - name: pull-request-title
              type: string
              default: ""
            - name: event
              type: string
            - name: target-branch
              type: string
              default: ""
          results: []
          workspaces:
            - name: basic-auth
            - name: go-cache
              optional: true
          volumes:
            - name: home
              emptyDir: {}
            # go-cache workspace provides GOMODCACHE/GOCACHE/GOPATH/GOTMPDIR/
            # etc. when bound; this single emptyDir is the fallback used
            # when it is not. Mounted directly at /home/default/.cache
            # (rather than at each individual subdirectory) so every
            # subdirectory Go/tools create under it (go-mod, go-build,
            # golangci-lint, go-tmp, ...) sits on one real, writable mount
            # point instead of relying on kubelet auto-creating .cache as a
            # plain (root-owned, non-writable-by-us) intermediate directory
            # for several separately-mounted volumes.
            - name: cache-fallback
              emptyDir: {}
          stepTemplate:
            name: stepTemplate
            env:
              - name: HOME
                value: /home/default
              # Go cache defaults — overridden by the cache-setup script
              # when the go-cache workspace is bound.
              - name: GOMODCACHE
                value: /home/default/.cache/go-mod
              - name: GOCACHE
                value: /home/default/.cache/go-build
              - name: GOLANGCI_LINT_CACHE
                value: /home/default/.cache/golangci-lint
              - name: XDG_CACHE_HOME
                value: /home/default/.cache
              # GOPATH defaults to a baked-in, read-only path inside the
              # toolbox image (e.g. /go); go install/module verification
              # (sumdb) needs to write under $GOPATH/pkg, so it must be
              # redirected too, same as the other caches above.
              - name: GOPATH
                value: /home/default/.cache/gopath
              - name: GOENV
                value: /home/default/.cache/go-env/env
              # go build/install create transient scratch work dirs via
              # os.TempDir() (defaults to /tmp), which is on the read-only
              # root filesystem in this pod — redirect to the writable
              # cache volume. Not persisted on the go-cache PVC since
              # these dirs are deleted after each build anyway.
              - name: GOTMPDIR
                value: /home/default/.cache/go-tmp
              # Generic temp dir for non-Go tools (mktemp, git, tar, etc. —
              # e.g. scripts/pull-schemas.sh, pull-policies.sh,
              # pull-scoped-resources.sh all call `mktemp -d`), which
              # default to $TMPDIR or /tmp — also read-only in this pod.
              - name: TMPDIR
                value: /home/default/.cache/tmp
              - name: GOMAXPROCS
                value: "12"
              - name: GO_CACHE_BOUND
                value: $(workspaces.go-cache.bound)
              - name: GO_CACHE_PATH
                value: $(workspaces.go-cache.path)
            volumeMounts:
              - name: home
                mountPath: /home/default
              - name: cache-fallback
                mountPath: /home/default/.cache
            computeResources:
              requests:
                cpu: "1"
                memory: 500Mi
                ephemeral-storage: 3Gi
              limits:
                cpu: "6"
                memory: 5Gi
                ephemeral-storage: 6Gi
            securityContext:
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
          steps:
            - name: build
              image: registry.arthurvardevanyan.com/homelab/toolbox:not_latest
              env:
                - name: PARAM_GIT_URL
                  value: $(params.git-url)
                - name: PARAM_REVISION
                  value: $(params.revision)
                - name: PARAM_PR_NUMBER
                  value: $(params.pull-request-number)
                - name: PARAM_PR_TITLE
                  value: $(params.pull-request-title)
                - name: PARAM_EVENT
                  value: $(params.event)
                - name: PARAM_TARGET_BRANCH
                  value: $(params.target-branch)
                - name: AUTH_PATH
                  value: $(workspaces.basic-auth.path)
              script: |
                #!/bin/bash
                set -o errexit
                set -o nounset
                set -o pipefail

                # Declare Tekton-injected env vars for shellcheck
                : "${PARAM_GIT_URL:=""}"
                : "${PARAM_REVISION:=""}"
                : "${PARAM_PR_NUMBER:=""}"
                : "${PARAM_PR_TITLE:=""}"
                : "${PARAM_EVENT:=""}"
                : "${PARAM_TARGET_BRANCH:=""}"
                : "${AUTH_PATH:=""}"
                : "${GO_CACHE_BOUND:=""}"
                : "${GO_CACHE_PATH:=""}"

                # REPO_DIR is computed here (rather than down in ── Clone ──
                # below) because the golangci-lint cache guard immediately
                # below needs it: golangci-lint's own result cache stores
                # absolute source-file paths (used to re-render cached
                # findings' source snippets), so if REPO_DIR's location ever
                # changes across runs while GOLANGCI_LINT_CACHE persists
                # (e.g. this cache existed before REPO_DIR moved onto this
                # PVC), its cached entries point at files that no longer
                # exist at that path - producing "no such file or
                # directory" warnings and stale/duplicated findings, not a
                # clean cache miss. See ── Clone ── below for why REPO_DIR
                # itself is persisted.
                if [[ "${GO_CACHE_BOUND}" == "true" ]]; then
                  REPO_DIR="${GO_CACHE_PATH}/src"
                else
                  REPO_DIR="/home/default/src"
                fi

                # ── Go caches ──────────────────────────────────────────────────
                # When the optional go-cache workspace is bound, redirect every
                # Go cache to the persistent PVC (module cache, build cache,
                # golangci-lint cache, XDG cache for schemas/policies). When
                # absent the stepTemplate env defaults keep caches on the local
                # emptyDir home volume — cold but self-contained.
                if [[ "${GO_CACHE_BOUND}" == "true" ]]; then
                  export GOMODCACHE="${GO_CACHE_PATH}/mod"
                  export GOCACHE="${GO_CACHE_PATH}/go-build"
                  export GOLANGCI_LINT_CACHE="${GO_CACHE_PATH}/golangci-lint"
                  export XDG_CACHE_HOME="${GO_CACHE_PATH}/.cache"
                  export GOPATH="${GO_CACHE_PATH}/gopath"
                  export GOENV="${GO_CACHE_PATH}/go-env/env"
                  # Redirect the installed Go dev-tools dir (.tool/) onto the
                  # PVC too — otherwise it lives in the fresh-clone workspace
                  # and every push re-installs golangci-lint/govulncheck/
                  # gofumpt/goimports. Consumed by Taskfile's TOOLS var.
                  # Keyed by architecture: the go-cache PVC can be mounted
                  # on nodes of different architectures (amd64/arm64), but Go
                  # tool binaries are arch-specific. Without the arch segment
                  # they'd share one dir, and Taskfile's install_tool guard —
                  # which skips reinstalling whenever the binary exists and
                  # its recorded version marker matches — would keep a
                  # wrong-arch binary a prior run installed, only for it to
                  # fail at exec with "exec format error". A per-arch path
                  # makes each architecture install and cache its own tools.
                  # (ARCH is assigned separately, then referenced, to keep
                  # the export SC2155-clean — matching REPO_DIR above.)
                  ARCH="$(uname -m)"
                  export K8S_GITOPS_CI_TOOLS_DIR="${GO_CACHE_PATH}/tool/${ARCH}"

                  # golangci-lint cache guard (see comment above REPO_DIR):
                  # if REPO_DIR's location differs from the value recorded
                  # the last time this ran, wipe the stale cache rather than
                  # let it silently poison this run's lint output. A marker
                  # mismatch/absence both trigger this (absence covers the
                  # first run ever, and the one-time migration to this
                  # REPO_DIR-on-PVC scheme).
                  REPO_DIR_MARKER="${GO_CACHE_PATH}/golangci-lint.repo-dir"
                  if [[ ! -f "${REPO_DIR_MARKER}" ]] || [[ "$(cat "${REPO_DIR_MARKER}")" != "${REPO_DIR}" ]]; then
                    echo "REPO_DIR changed (or first run) - clearing stale golangci-lint cache"
                    rm -rf "${GOLANGCI_LINT_CACHE}"
                  fi
                  mkdir -p "${GOMODCACHE}" "${GOCACHE}" "${GOLANGCI_LINT_CACHE}" "${XDG_CACHE_HOME}" "${GOPATH}" "${K8S_GITOPS_CI_TOOLS_DIR}"
                  printf '%s' "${REPO_DIR}" >"${REPO_DIR_MARKER}"
                  echo "Using persistent Go caches under: ${GO_CACHE_PATH}"
                fi

                # go build/install use os.TempDir() (GOTMPDIR, default /tmp)
                # for transient scratch work dirs regardless of GOCACHE;
                # /tmp is on the read-only root filesystem in this pod, so
                # this must always be redirected, bound or not. Same for
                # TMPDIR, used by mktemp and other non-Go tooling.
                mkdir -p "${GOTMPDIR}" "${TMPDIR}"

                go env GOPATH GOMODCACHE GOCACHE GOLANGCI_LINT_CACHE GOTMPDIR

                # ── Clone ──────────────────────────────────────────────────────
                # Single-step clone+build: no separate git-clone Task/PVC
                # workspace is needed since everything runs in this one pod.
                #
                # REPO_DIR (computed above, alongside the golangci-lint cache
                # guard that depends on it) lives on the go-cache PVC when
                # bound and is reused across runs via fetch+reset, rather
                # than a fresh `git init` into the pod-local emptyDir every
                # time. This matters beyond avoiding a re-clone: go test's
                # cache keys file inputs on mtime+size, not content (see `go
                # doc -src cmd/go/internal/test.hashOpen`), and refuses to
                # cache a file read within 2s of its mtime at all. A fresh
                # checkout gives every file a brand-new mtime on every
                # single run, which silently defeats go test's cache for
                # every package whose tests open a repo file (testdata
                # fixtures, etc.) - `git reset --hard` (vs. a fresh
                # checkout) only rewrites files whose content actually
                # changed, so unchanged files keep their prior mtime and go
                # test's cache can actually hit across runs. Falls back to
                # the pod-local emptyDir, fresh each time, when the PVC
                # isn't bound - same as every other cache in this step.
                mkdir -p "${REPO_DIR}"
                cd "${REPO_DIR}"
                git config --global --add safe.directory "${REPO_DIR}"

                gh auth login --hostname "github.com" \
                  --with-token <"${AUTH_PATH}/git-provider-token"
                gh auth setup-git --hostname "github.com"
                GITHUB_TOKEN=$(cat "${AUTH_PATH}/git-provider-token")
                export GITHUB_TOKEN

                # Re-init only if this isn't already a git repo (first run,
                # or the PVC isn't bound) - `git rev-parse` also catches a
                # corrupt/partial .git left by an aborted previous run,
                # self-healing via a fresh init rather than staying wedged.
                if ! git rev-parse --git-dir >/dev/null 2>&1; then
                  git init -q
                fi
                # Idempotent remote: a persisted checkout already has
                # "origin" from the previous run.
                git remote remove origin 2>/dev/null || true
                git remote add origin "${PARAM_GIT_URL}"
                git fetch origin "${PARAM_REVISION}"
                git reset --hard FETCH_HEAD
                # Removes untracked leftovers from a previous run's revision
                # (e.g. a file deleted since); deliberately not `-x`, so
                # gitignored artifacts this run wants to reuse survive -
                # schemas.tar.gz/policies.tar.gz + their .ref markers
                # (scripts/pull-*.sh's own short-circuit), .task/ (Task's
                # sources:/generates: checksum tracking), bin/.
                git clean -fd
                # --prune-tags: a persisted checkout can otherwise
                # accumulate local tags created by this same step's own
                # `git tag` call below on a prior push run. Pruning keeps the
                # local tag set in sync with the remote so the release step's
                # "does v${VERSION} already exist?" idempotency check reflects
                # what's actually published, not a stale local-only tag.
                git fetch --tags --force --prune --prune-tags origin
                # Fetch tags from upstream for the version check. Fork PRs
                # clone from the fork URL, which may not carry upstream's
                # release tags — without this, LATEST is empty and Guard 3
                # (bump-correctness) is silently skipped. Set UPSTREAM_GIT_URL
                # in the CI environment (toolbox image or pipeline env) to
                # the upstream repo URL.
                UPSTREAM="${UPSTREAM_GIT_URL:-}"
                if [ -n "${UPSTREAM}" ] && [ "${UPSTREAM}" != "${PARAM_GIT_URL}" ]; then
                  if git remote add upstream "${UPSTREAM}" 2>/dev/null || true; then
                    git fetch upstream --tags 2>/dev/null && \
                      echo "Fetched upstream tags for version check"
                    git remote remove upstream 2>/dev/null || true
                  fi
                fi

                # Make version:check's "not behind main's VERSION" downgrade
                # guard (Guard 2) actually work in the pipeline. The clone above
                # only fetches the single revision SHA + tags, so origin/main
                # (the task's default base ref) is NOT present — without this,
                # Guard 2 silently no-ops here. On a pull_request, fetch the
                # target branch and point the guard at it via the base-ref
                # override the task already honors. On a push (merge to main),
                # HEAD already *is* main, so no base fetch is needed.
                if [ "${PARAM_EVENT}" = "pull_request" ] && [ -n "${PARAM_TARGET_BRANCH}" ]; then
                  if git fetch origin "${PARAM_TARGET_BRANCH}" 2>/dev/null; then
                    export VERSION_CHECK_BASE_REF="FETCH_HEAD"
                  fi
                fi

                # Feed version:check's Guard 3 the PR title so it sizes the
                # required VERSION bump from the squash-merge source (the PR
                # title becomes the squash commit subject) rather than only the
                # discarded branch commits. Empty on a push (no PR) — the guard
                # then falls back to commit-based sizing alone.
                export PR_TITLE="${PARAM_PR_TITLE}"

                # Run the full CI gate, but capture its exit code instead of
                # letting `set -o errexit` abort here, so that on a PR event we
                # can still post an informative self-CI status comment (with the
                # ❌ verdict) before failing. The step re-asserts CI_RC at the
                # very end, so `task ci` remains the authoritative blocking gate.
                # Tee the output so the comment can embed a tail of the failing
                # step's log (the raw log is on the pipeline anyway).
                # ── Tool versions ──────────────────────────────────────────────
                echo "=== Tool versions ==="
                go version
                golangci-lint version || echo "golangci-lint not found"
                echo "======================"

                CI_RC=0
                CI_LOG="${TMPDIR}/task-ci.log"
                task ci 2>&1 | tee "${CI_LOG}" || CI_RC="${PIPESTATUS[0]}"

                # ── Self-CI status comment + non-blocking live replay ─────────
                # PR events only: a push has no PR to comment on. Everything in
                # this block is best-effort (|| true) and must NEVER change the
                # build's pass/fail outcome — only CI_RC does that.
                if [ "${PARAM_EVENT}" = "pull_request" ]; then
                  CI_STATUS="pass"
                  CI_REPORT_ARGS=()
                  if [ "${CI_RC}" -ne 0 ]; then
                    CI_STATUS="fail"
                    # Embed only the last lines of the CI log to keep the
                    # comment compact; the full log lives on the pipeline.
                    CI_DETAIL="${TMPDIR}/task-ci-tail.log"
                    tail -n 40 "${CI_LOG}" >"${CI_DETAIL}" || true
                    CI_REPORT_ARGS+=(--ci-report "${CI_DETAIL}")
                  fi

                  # Live regression replay — a non-blocking false-positive smoke
                  # gate (see docs/DEVELOPMENT.md#end-to-end--regression-replay).
                  # Runs after the gate, so it never blocks. Per-PR wall time may
                  # rise a little under contention/GitHub throttling, but the
                  # aggregate stays well within budget.
                  # Exit-code contract from scripts/test-homelab-prs.sh:
                  #   0 = all passed → pass; 1 = some PRs failed → warn
                  #   (eyeball the diff, not necessarily a regression);
                  #   other = harness/setup error → fail.
                  REPLAY_REPORT="${TMPDIR}/homelab-replay.md"
                  REPLAY_RC=0
                  task test:homelab-prs COUNT=50 PARALLEL=25 OUTPUT="${REPLAY_REPORT}" || REPLAY_RC=$?
                  case "${REPLAY_RC}" in
                  0) REPLAY_STATUS="pass" ;;
                  1) REPLAY_STATUS="warn" ;;
                  *) REPLAY_STATUS="fail" ;;
                  esac

                  k8s-gitops-ci-bin() { "${REPO_DIR}/bin/k8s-gitops-ci" "$@"; }
                  k8s-gitops-ci-bin ci-report \
                    --url "${PARAM_GIT_URL}" \
                    --pr "${PARAM_PR_NUMBER}" \
                    --ci-status "${CI_STATUS}" \
                    "${CI_REPORT_ARGS[@]}" \
                    --replay-status "${REPLAY_STATUS}" \
                    --replay-report "${REPLAY_REPORT}" || true
                fi

                # Re-assert the CI gate: fail the step iff `task ci` failed.
                if [ "${CI_RC}" -ne 0 ]; then
                  echo "task ci failed (exit ${CI_RC})"
                  exit "${CI_RC}"
                fi

                # Release handling for a push (merge to main) has three
                # outcomes — GA, RC, or CI-only — all gated on the VERSION file
                # and the commits/paths since the last GA. See docs/RELEASE.md.
                if [ "${PARAM_EVENT}" = "push" ]; then
                  VERSION="$(tr -d '[:space:]' <VERSION)"
                  NEW_SEMVER="v${VERSION}"

                  # Latest GA tag (strict vMAJOR.MINOR.PATCH — never an -rc tag,
                  # so RC tags can't masquerade as the latest GA and mixed
                  # GA/RC sets are never sort -V'd, which orders pre-releases
                  # wrongly).
                  LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                    | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 | sed 's/^v//' || true)"

                  # delete_rcs <base>: remove every v<base>-rc.* GitHub release
                  # AND its tag, locally and on the remote. Best-effort — a
                  # cleanup hiccup must never fail a publish.
                  # Uses the GitHub REST API directly (curl) instead of `gh release
                  # delete` — `gh`'s --cleanup-tag is version-dependent and can
                  # silently fail depending on the installed `gh` version, token
                  # scopes, and API rate limits; curl + the REST API is
                  # deterministic and gives the same permissions as the existing
                  # GITHUB_TOKEN used throughout this step.
                  delete_rcs() {
                    _base="$1"
                    _repo="${PARAM_GIT_URL##*github.com/}"
                    _repo="${_repo%.git}"
                    for _t in $(git tag -l "v${_base}-rc.*"); do
                      # Delete the GitHub Release (which also removes the tag
                      # from GitHub's side). -sf = silent + fail on HTTP error;
                      # || true so cleanup never fails a publish.
                      curl -sf -X DELETE \
                        -H "Authorization: token ${GITHUB_TOKEN}" \
                        "https://api.github.com/repos/${_repo}/releases/tags/${_t}" \
                        2>/dev/null || true
                      # Fallback: push deletion to the remote (no-op if the tag
                      # was already deleted via the API above).
                      git push origin ":refs/tags/${_t}" 2>/dev/null || true
                      # Local cleanup.
                      git tag -d "${_t}" 2>/dev/null || true
                    done
                  }

                  if ! git rev-parse -q --verify "refs/tags/${NEW_SEMVER}" >/dev/null; then
                    # ── GA ────────────────────────────────────────────────────
                    # v${VERSION} isn't tagged yet → VERSION advanced → cut GA.
                    # Defense-in-depth against a stale/bad VERSION slipping past
                    # task ci's version:check: re-validate format + strictly >
                    # latest tag.
                    if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "VERSION '${VERSION}' is not valid MAJOR.MINOR.PATCH" >&2
                      exit 1
                    fi
                    if [ -n "${LATEST}" ]; then
                      HIGHEST="$(printf '%s\n%s\n' "${VERSION}" "${LATEST}" | sort -V | tail -n1)"
                      if [ "${HIGHEST}" != "${VERSION}" ] || [ "${VERSION}" = "${LATEST}" ]; then
                        echo "VERSION '${VERSION}' is not greater than latest tag 'v${LATEST}'" >&2
                        exit 1
                      fi
                    fi

                    echo "Releasing GA ${NEW_SEMVER}..."
                    # Delete this version's RC releases + tags BEFORE cutting
                    # GA. GitHub-native release notes (changelog.use:
                    # github-native) derive "previous tag" from the most recent
                    # tag by date/semver; if the v${VERSION}-rc.* tags still
                    # exist, the notes compare against the RC instead of the
                    # prior GA, producing a truncated changelog and a wrong
                    # "Full Changelog" compare link. Removing them first makes
                    # the previous tag resolve to the last real GA.
                    delete_rcs "${VERSION}"

                    # GoReleaser only validates that GORELEASER_CURRENT_TAG
                    # exists as a local git tag pointing at HEAD (a local-only
                    # check); its GitHub Releases API call (target_commitish)
                    # auto-creates the tag on GitHub.
                    git tag "${NEW_SEMVER}" "${PARAM_REVISION}"
                    # Release body = GitHub-native notes (changelog.use:
                    # github-native), so no --release-notes file is passed.
                    GORELEASER_CURRENT_TAG="${NEW_SEMVER}" goreleaser release --skip=ko --clean
                  else
                    # ── RC or CI-only ─────────────────────────────────────────
                    # v${VERSION} is already the latest GA tag (VERSION == the
                    # released version). Cut a release candidate for the *next*
                    # version, but only when there's an actual shippable change.
                    #
                    # NEXT = the version the unreleased conventional commits
                    # warrant (git-cliff, same advisor as version:check). No
                    # git-cliff (or no releasable commit) → nothing to size →
                    # CI-only.
                    NEXT=""
                    if command -v git-cliff >/dev/null 2>&1; then
                      NEXT="$(git-cliff --bumped-version --unreleased 2>/dev/null | sed 's/^v//' || true)"
                    fi

                    # Binary-affecting change since the last GA? RC is worth
                    # cutting only if the *shipped artifact* could differ —
                    # Go sources, the build-time embedded-data pulls
                    # (schemas/policies SHAs live in scripts/pull-*.sh), and
                    # goreleaser's build config. Docs/CI/config/go.mod-only
                    # merges change nothing shippable → no RC.
                    # Go sources at any depth: use an explicit :(glob) pathspec
                    # for both nested (**/*.go) and root (*.go) files rather
                    # than relying on default-pathspec '*' spanning '/'.
                    CHANGED=""
                    if [ -n "${LATEST}" ]; then
                      CHANGED="$(git diff --name-only "v${LATEST}..HEAD" -- \
                        ':(glob)**/*.go' ':(glob)*.go' \
                        scripts/pull-schemas.sh scripts/pull-policies.sh scripts/pull-all.sh \
                        .goreleaser.yaml 2>/dev/null || true)"
                    fi

                    if [ -n "${NEXT}" ] \
                      && printf '%s' "${NEXT}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
                      && [ "${NEXT}" != "${LATEST}" ] \
                      && [ -n "${CHANGED}" ]; then
                      # Drop RCs for any *other* base (a shifted next version
                      # means the old base will never GA).
                      for _rct in $(git tag -l 'v*-rc.*'); do
                        _rcbase="$(printf '%s' "${_rct}" | sed -n 's/^v\([0-9]\+\.[0-9]\+\.[0-9]\+\)-rc\.[0-9]\+$/\1/p')"
                        [ -n "${_rcbase}" ] && [ "${_rcbase}" != "${NEXT}" ] && delete_rcs "${_rcbase}"
                      done

                      # Idempotency: HEAD already carries an rc tag for NEXT
                      # (pipeline re-run) → nothing to do.
                      if git tag --points-at HEAD | grep -Eq "^v${NEXT}-rc\.[0-9]+$"; then
                        echo "RC for ${NEXT} already tagged at HEAD; skipping."
                      else
                        # N = highest existing v${NEXT}-rc.<N> + 1 (numeric scan,
                        # not sort -V, which mis-orders pre-releases).
                        N="$(git tag -l "v${NEXT}-rc.*" \
                          | sed -n "s/^v${NEXT}-rc\.\([0-9]\+\)\$/\1/p" \
                          | sort -n | tail -n1 || true)"
                        N=$(( ${N:-0} + 1 ))
                        RC_TAG="v${NEXT}-rc.${N}"
                        echo "Releasing candidate ${RC_TAG}..."
                        git tag "${RC_TAG}" "${PARAM_REVISION}"
                        # goreleaser's default prerelease:auto marks an -rc tag
                        # as a GitHub pre-release (never "Latest").
                        GORELEASER_CURRENT_TAG="${RC_TAG}" goreleaser release --skip=ko --clean
                      fi
                    else
                      echo "No shippable change since v${LATEST:-<none>} (or nothing to release); CI only, no RC."
                    fi
                  fi
                else
                  # PR event - run Goreleaser with snapshot tag using short SHA
                  SHORT_SHA="${PARAM_REVISION:0:7}"
                  TAG="v$(date -u +%Y%m%d%H%M%S)-pr-${PARAM_PR_NUMBER}-${SHORT_SHA}"
                  echo "Creating snapshot release: ${TAG}"
                  GORELEASER_CURRENT_TAG="${TAG}" goreleaser release --snapshot --skip=ko --clean
                fi

      - name: lint
        when:
          - input: "$(params.event)"
            operator: in
            values: ["pull_request"]
        workspaces:
          - name: basic-auth
            workspace: git_auth_secret
        params:
          - name: git-url
            value: $(params.git-url)
          - name: revision
            value: $(params.git-commit)
          - name: pull-request-number
            value: $(params.pull-request-number)
          - name: target-branch
            value: $(params.target-branch)
        taskSpec:
          params:
            - name: git-url
              type: string
            - name: revision
              type: string
            - name: pull-request-number
              type: string
              default: ""
            - name: target-branch
              type: string
          workspaces:
            - name: basic-auth
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
          stepTemplate:
            name: stepTemplate
            volumeMounts:
              - name: tmp
                mountPath: /tmp
            computeResources:
              requests:
                cpu: 250m
                memory: 256Mi
                ephemeral-storage: 256Mi
              limits:
                cpu: "2"
                memory: 1Gi
                ephemeral-storage: 1Gi
            securityContext:
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
          steps:
            - name: lint
              image: registry.arthurvardevanyan.com/homelab/toolbox:not_latest
              env:
                - name: PARAM_GIT_URL
                  value: $(params.git-url)
                - name: PARAM_REVISION
                  value: $(params.revision)
                - name: PARAM_PR_NUMBER
                  value: $(params.pull-request-number)
                - name: PARAM_TARGET_BRANCH
                  value: $(params.target-branch)
                - name: AUTH_PATH
                  value: $(workspaces.basic-auth.path)
              script: |
                #!/bin/bash
                set -o errexit
                set -o nounset
                set -o pipefail

                # Declare Tekton-injected env vars for shellcheck
                : "${PARAM_GIT_URL:=""}"
                : "${PARAM_REVISION:=""}"
                : "${PARAM_PR_NUMBER:=""}"
                : "${PARAM_TARGET_BRANCH:=""}"
                : "${AUTH_PATH:=""}"

                # ── Tool versions ──────────────────────────────────────────────
                echo "=== Tool versions ==="
                go version
                golangci-lint version || echo "golangci-lint not found"
                echo "======================"

                # No separate clone step: `k8s-gitops-ci pipeline --url`
                # clones into its own temp directory internally (see
                # pkg/git.Clone) and cleans up after itself. gh auth setup-git
                # installs a git credential helper for that internal clone,
                # same rationale as the `build` step's own clone above.
                gh auth login --hostname "github.com" \
                  --with-token <"${AUTH_PATH}/git-provider-token"
                gh auth setup-git --hostname "github.com"

                k8s-gitops-ci pipeline \
                  --url "${PARAM_GIT_URL}" \
                  --pr "${PARAM_PR_NUMBER}" \
                  --revision "${PARAM_REVISION}" \
                  --target-branch "${PARAM_TARGET_BRANCH}" \
                  --disable-checks golangci \
                  --comment \
                  --quiet

      # TODO: clair scan (re-enable once image build is wired up)
      # - name: clair-action
      #   runAfter:
      #     - build
      #   taskRef:
      #     name: clair-action
      #     kind: Task
      #   params:
      #     - name: IMAGE
      #       value: $(tasks.build.results.IMAGE)

  taskRunTemplate:
    serviceAccountName: pipeline
    podTemplate:
      runtimeClassName: selinux
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
  workspaces:
    - name: git_auth_secret
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: go-cache
      persistentVolumeClaim:
        claimName: go-cache
