---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: k8s-gitops-ci
  annotations:
    io.kubernetes.cri-o.TrySkipVolumeSELinuxLabel: "true"
    # The toolbox image is deliberately floating (Renovate-updated, not
    # git-tracked per-digest) - both the `build` and `lint` steps below use
    # it. See docs/EXEMPTIONS.md's annotation-exemption mode.
    gitops-ci.k8s.io/exempt-image-checksum: "registry.arthurvardevanyan.com/homelab/toolbox:not_latest"
    pipelinesascode.tekton.dev/on-cel-expression: |
      (event == "pull_request" || event == "push") && target_branch == "main"
    pipelinesascode.tekton.dev/max-concurrency: "1"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/target-namespace: "k8s-gitops-ci"
    pipelinesascode.tekton.dev/task-1: "https://raw.githubusercontent.com/ArthurVardevanyan/HomeLab/main/tekton/base/clair-action/clair-action-task.yaml"
spec:
  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-commit
      value: "{{ revision }}"
    - name: pull-request-number
      value: "{{ pull_request_number }}"
    - name: event
      value: "{{ event_type }}"
    - name: target-branch
      value: "{{ target_branch }}"
  pipelineSpec:
    params:
      - name: git-url
        type: string
      - name: git-commit
        type: string
      - name: pull-request-number
        type: string
        default: ""
      - name: event
        type: string
      - name: target-branch
        type: string
    workspaces:
      - name: git_auth_secret
      - name: go-cache
        optional: true
    tasks:
      - name: build
        workspaces:
          - name: basic-auth
            workspace: git_auth_secret
          - name: go-cache
            workspace: go-cache
        params:
          - name: git-url
            value: $(params.git-url)
          - name: revision
            value: $(params.git-commit)
          - name: pull-request-number
            value: $(params.pull-request-number)
          - name: event
            value: $(params.event)
        taskSpec:
          params:
            - name: git-url
              type: string
            - name: revision
              type: string
            - name: pull-request-number
              type: string
              default: ""
            - name: event
              type: string
          results: []
          workspaces:
            - name: basic-auth
            - name: go-cache
              optional: true
          volumes:
            - name: home
              emptyDir: {}
            # go-cache workspace provides GOMODCACHE/GOCACHE/GOPATH/GOTMPDIR/
            # etc. when bound; this single emptyDir is the fallback used
            # when it is not. Mounted directly at /home/default/.cache
            # (rather than at each individual subdirectory) so every
            # subdirectory Go/tools create under it (go-mod, go-build,
            # golangci-lint, go-tmp, ...) sits on one real, writable mount
            # point instead of relying on kubelet auto-creating .cache as a
            # plain (root-owned, non-writable-by-us) intermediate directory
            # for several separately-mounted volumes.
            - name: cache-fallback
              emptyDir: {}
          stepTemplate:
            name: stepTemplate
            env:
              - name: HOME
                value: /home/default
              # Go cache defaults — overridden by the cache-setup script
              # when the go-cache workspace is bound.
              - name: GOMODCACHE
                value: /home/default/.cache/go-mod
              - name: GOCACHE
                value: /home/default/.cache/go-build
              - name: GOLANGCI_LINT_CACHE
                value: /home/default/.cache/golangci-lint
              - name: XDG_CACHE_HOME
                value: /home/default/.cache
              # GOPATH defaults to a baked-in, read-only path inside the
              # toolbox image (e.g. /go); go install/module verification
              # (sumdb) needs to write under $GOPATH/pkg, so it must be
              # redirected too, same as the other caches above.
              - name: GOPATH
                value: /home/default/.cache/gopath
              - name: GOENV
                value: /home/default/.cache/go-env/env
              # go build/install create transient scratch work dirs via
              # os.TempDir() (defaults to /tmp), which is on the read-only
              # root filesystem in this pod — redirect to the writable
              # cache volume. Not persisted on the go-cache PVC since
              # these dirs are deleted after each build anyway.
              - name: GOTMPDIR
                value: /home/default/.cache/go-tmp
              # Generic temp dir for non-Go tools (mktemp, git, tar, etc. —
              # e.g. scripts/pull-schemas.sh, pull-policies.sh,
              # pull-scoped-resources.sh all call `mktemp -d`), which
              # default to $TMPDIR or /tmp — also read-only in this pod.
              - name: TMPDIR
                value: /home/default/.cache/tmp
              - name: GOMAXPROCS
                value: "12"
              - name: GO_CACHE_BOUND
                value: $(workspaces.go-cache.bound)
              - name: GO_CACHE_PATH
                value: $(workspaces.go-cache.path)
            volumeMounts:
              - name: home
                mountPath: /home/default
              - name: cache-fallback
                mountPath: /home/default/.cache
            computeResources:
              requests:
                cpu: "1"
                memory: 500Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: "6"
                memory: 5Gi
                ephemeral-storage: 3Gi
            securityContext:
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
          steps:
            - name: build
              image: registry.arthurvardevanyan.com/homelab/toolbox:not_latest
              env:
                - name: PARAM_GIT_URL
                  value: $(params.git-url)
                - name: PARAM_REVISION
                  value: $(params.revision)
                - name: PARAM_PR_NUMBER
                  value: $(params.pull-request-number)
                - name: PARAM_EVENT
                  value: $(params.event)
                - name: AUTH_PATH
                  value: $(workspaces.basic-auth.path)
              script: |
                #!/bin/bash
                set -o errexit
                set -o nounset
                set -o pipefail

                # Declare Tekton-injected env vars for shellcheck
                : "${PARAM_GIT_URL:=""}"
                : "${PARAM_REVISION:=""}"
                : "${PARAM_PR_NUMBER:=""}"
                : "${PARAM_EVENT:=""}"
                : "${AUTH_PATH:=""}"
                : "${GO_CACHE_BOUND:=""}"
                : "${GO_CACHE_PATH:=""}"

                # REPO_DIR is computed here (rather than down in ── Clone ──
                # below) because the golangci-lint cache guard immediately
                # below needs it: golangci-lint's own result cache stores
                # absolute source-file paths (used to re-render cached
                # findings' source snippets), so if REPO_DIR's location ever
                # changes across runs while GOLANGCI_LINT_CACHE persists
                # (e.g. this cache existed before REPO_DIR moved onto this
                # PVC), its cached entries point at files that no longer
                # exist at that path - producing "no such file or
                # directory" warnings and stale/duplicated findings, not a
                # clean cache miss. See ── Clone ── below for why REPO_DIR
                # itself is persisted.
                if [[ "${GO_CACHE_BOUND}" == "true" ]]; then
                  REPO_DIR="${GO_CACHE_PATH}/src"
                else
                  REPO_DIR="/home/default/src"
                fi

                # ── Go caches ──────────────────────────────────────────────────
                # When the optional go-cache workspace is bound, redirect every
                # Go cache to the persistent PVC (module cache, build cache,
                # golangci-lint cache, XDG cache for schemas/policies). When
                # absent the stepTemplate env defaults keep caches on the local
                # emptyDir home volume — cold but self-contained.
                if [[ "${GO_CACHE_BOUND}" == "true" ]]; then
                  export GOMODCACHE="${GO_CACHE_PATH}/mod"
                  export GOCACHE="${GO_CACHE_PATH}/go-build"
                  export GOLANGCI_LINT_CACHE="${GO_CACHE_PATH}/golangci-lint"
                  export XDG_CACHE_HOME="${GO_CACHE_PATH}/.cache"
                  export GOPATH="${GO_CACHE_PATH}/gopath"
                  export GOENV="${GO_CACHE_PATH}/go-env/env"
                  # Redirect the installed Go dev-tools dir (.tool/) onto the
                  # PVC too — otherwise it lives in the fresh-clone workspace
                  # and every push re-installs golangci-lint/govulncheck/
                  # gofumpt/goimports. Consumed by Taskfile's TOOLS var.
                  # Keyed by architecture: the go-cache PVC can be mounted
                  # on nodes of different architectures (amd64/arm64), but Go
                  # tool binaries are arch-specific. Without the arch segment
                  # they'd share one dir, and Taskfile's install_tool guard —
                  # which skips reinstalling whenever the binary exists and
                  # its recorded version marker matches — would keep a
                  # wrong-arch binary a prior run installed, only for it to
                  # fail at exec with "exec format error". A per-arch path
                  # makes each architecture install and cache its own tools.
                  # (ARCH is assigned separately, then referenced, to keep
                  # the export SC2155-clean — matching REPO_DIR above.)
                  ARCH="$(uname -m)"
                  export K8S_GITOPS_CI_TOOLS_DIR="${GO_CACHE_PATH}/tool/${ARCH}"

                  # golangci-lint cache guard (see comment above REPO_DIR):
                  # if REPO_DIR's location differs from the value recorded
                  # the last time this ran, wipe the stale cache rather than
                  # let it silently poison this run's lint output. A marker
                  # mismatch/absence both trigger this (absence covers the
                  # first run ever, and the one-time migration to this
                  # REPO_DIR-on-PVC scheme).
                  REPO_DIR_MARKER="${GO_CACHE_PATH}/golangci-lint.repo-dir"
                  if [[ ! -f "${REPO_DIR_MARKER}" ]] || [[ "$(cat "${REPO_DIR_MARKER}")" != "${REPO_DIR}" ]]; then
                    echo "REPO_DIR changed (or first run) - clearing stale golangci-lint cache"
                    rm -rf "${GOLANGCI_LINT_CACHE}"
                  fi
                  mkdir -p "${GOMODCACHE}" "${GOCACHE}" "${GOLANGCI_LINT_CACHE}" "${XDG_CACHE_HOME}" "${GOPATH}" "${K8S_GITOPS_CI_TOOLS_DIR}"
                  printf '%s' "${REPO_DIR}" >"${REPO_DIR_MARKER}"
                  echo "Using persistent Go caches under: ${GO_CACHE_PATH}"
                fi

                # go build/install use os.TempDir() (GOTMPDIR, default /tmp)
                # for transient scratch work dirs regardless of GOCACHE;
                # /tmp is on the read-only root filesystem in this pod, so
                # this must always be redirected, bound or not. Same for
                # TMPDIR, used by mktemp and other non-Go tooling.
                mkdir -p "${GOTMPDIR}" "${TMPDIR}"

                go env GOPATH GOMODCACHE GOCACHE GOLANGCI_LINT_CACHE GOTMPDIR

                # ── Clone ──────────────────────────────────────────────────────
                # Single-step clone+build: no separate git-clone Task/PVC
                # workspace is needed since everything runs in this one pod.
                #
                # REPO_DIR (computed above, alongside the golangci-lint cache
                # guard that depends on it) lives on the go-cache PVC when
                # bound and is reused across runs via fetch+reset, rather
                # than a fresh `git init` into the pod-local emptyDir every
                # time. This matters beyond avoiding a re-clone: go test's
                # cache keys file inputs on mtime+size, not content (see `go
                # doc -src cmd/go/internal/test.hashOpen`), and refuses to
                # cache a file read within 2s of its mtime at all. A fresh
                # checkout gives every file a brand-new mtime on every
                # single run, which silently defeats go test's cache for
                # every package whose tests open a repo file (testdata
                # fixtures, etc.) - `git reset --hard` (vs. a fresh
                # checkout) only rewrites files whose content actually
                # changed, so unchanged files keep their prior mtime and go
                # test's cache can actually hit across runs. Falls back to
                # the pod-local emptyDir, fresh each time, when the PVC
                # isn't bound - same as every other cache in this step.
                mkdir -p "${REPO_DIR}"
                cd "${REPO_DIR}"
                git config --global --add safe.directory "${REPO_DIR}"

                gh auth login --hostname "github.com" \
                  --with-token <"${AUTH_PATH}/git-provider-token"
                gh auth setup-git --hostname "github.com"
                GITHUB_TOKEN=$(cat "${AUTH_PATH}/git-provider-token")
                export GITHUB_TOKEN

                # Re-init only if this isn't already a git repo (first run,
                # or the PVC isn't bound) - `git rev-parse` also catches a
                # corrupt/partial .git left by an aborted previous run,
                # self-healing via a fresh init rather than staying wedged.
                if ! git rev-parse --git-dir >/dev/null 2>&1; then
                  git init -q
                fi
                # Idempotent remote: a persisted checkout already has
                # "origin" from the previous run.
                git remote remove origin 2>/dev/null || true
                git remote add origin "${PARAM_GIT_URL}"
                git fetch origin "${PARAM_REVISION}"
                git reset --hard FETCH_HEAD
                # Removes untracked leftovers from a previous run's revision
                # (e.g. a file deleted since); deliberately not `-x`, so
                # gitignored artifacts this run wants to reuse survive -
                # schemas.tar.gz/policies.tar.gz + their .ref markers
                # (scripts/pull-*.sh's own short-circuit), .task/ (Task's
                # sources:/generates: checksum tracking), bin/.
                git clean -fd
                # --prune-tags: a persisted checkout can otherwise
                # accumulate local tags created by this same step's own
                # `git tag` call below on a prior push run, which would
                # skew git-cliff's --bumped-version on this run.
                git fetch --tags --force --prune --prune-tags origin

                task ci

                # Push event - run Goreleaser with semantic version
                if [ "${PARAM_EVENT}" = "push" ]; then
                  # git-cliff's --bumped-version preserves whatever prefix
                  # style the latest matching tag already has; force a "v"
                  # prefix explicitly here (idempotent if it's already
                  # there) so every tag Go modules see is a valid semver
                  # tag (`vMAJOR.MINOR.PATCH`) — Go's module resolver
                  # silently ignores non-"v"-prefixed tags entirely.
                  RAW_SEMVER=$(git-cliff --bumped-version)
                  NEW_SEMVER="v${RAW_SEMVER#v}"
                  echo "Releasing ${NEW_SEMVER}..."

                  # GoReleaser only validates that GORELEASER_CURRENT_TAG
                  # exists as a local git tag pointing at HEAD — this is a
                  # local-only check ("git tag %v was not made against commit
                  # %v"), it does not need to exist on GitHub yet. GoReleaser's
                  # own release-creation call uses the GitHub Releases API
                  # with target_commitish (the same mechanism as
                  # `gh release create --target <sha>`), which auto-creates
                  # the tag on GitHub. Creating the tag ourselves via the raw
                  # Git Data API (git/tags + git/refs) is unnecessary and not
                  # permitted for this GitHub App token (403: Resource not
                  # accessible by integration).
                  git tag "${NEW_SEMVER}" "${PARAM_REVISION}"

                  # Generate the changelog with git-cliff (using cliff.toml's
                  # conventional-commit groupings) into a path outside the git
                  # worktree so it doesn't trip GoReleaser's dirty-state guard,
                  # then hand it to GoReleaser as the release body.
                  git-cliff --bump --unreleased -o "${TMPDIR}/CHANGELOG.md"

                  GORELEASER_CURRENT_TAG="${NEW_SEMVER}" goreleaser release --skip=ko --clean --release-notes "${TMPDIR}/CHANGELOG.md"
                else
                  # PR event - run Goreleaser with snapshot tag using short SHA
                  SHORT_SHA="${PARAM_REVISION:0:7}"
                  TAG="v$(date -u +%Y%m%d%H%M%S)-pr-${PARAM_PR_NUMBER}-${SHORT_SHA}"
                  echo "Creating snapshot release: ${TAG}"
                  GORELEASER_CURRENT_TAG="${TAG}" goreleaser release --snapshot --skip=ko --clean
                fi

      - name: lint
        # Only run for pull_request events - a push (i.e. a merge to main)
        # has no PR left to comment on, and everything --lint-only checks
        # was already checked on the PR that merged. Skipped cleanly by
        # Tekton (no pod spun up) rather than the script itself no-op'ing.
        when:
          - input: "$(params.event)"
            operator: in
            values: ["pull_request"]
        workspaces:
          - name: basic-auth
            workspace: git_auth_secret
        params:
          - name: git-url
            value: $(params.git-url)
          - name: revision
            value: $(params.git-commit)
          - name: pull-request-number
            value: $(params.pull-request-number)
          - name: target-branch
            value: $(params.target-branch)
        taskSpec:
          params:
            - name: git-url
              type: string
            - name: revision
              type: string
            - name: pull-request-number
              type: string
              default: ""
            - name: target-branch
              type: string
          workspaces:
            - name: basic-auth
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 512Mi
          stepTemplate:
            name: stepTemplate
            volumeMounts:
              - name: tmp
                mountPath: /tmp
            computeResources:
              requests:
                cpu: 250m
                memory: 256Mi
                ephemeral-storage: 256Mi
              limits:
                cpu: "2"
                memory: 1Gi
                ephemeral-storage: 1Gi
            securityContext:
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
              capabilities:
                drop:
                  - ALL
          steps:
            - name: lint
              image: registry.arthurvardevanyan.com/homelab/toolbox:not_latest
              env:
                - name: PARAM_GIT_URL
                  value: $(params.git-url)
                - name: PARAM_REVISION
                  value: $(params.revision)
                - name: PARAM_PR_NUMBER
                  value: $(params.pull-request-number)
                - name: PARAM_TARGET_BRANCH
                  value: $(params.target-branch)
                - name: AUTH_PATH
                  value: $(workspaces.basic-auth.path)
              script: |
                #!/bin/bash
                set -o errexit
                set -o nounset
                set -o pipefail

                # Declare Tekton-injected env vars for shellcheck
                : "${PARAM_GIT_URL:=""}"
                : "${PARAM_REVISION:=""}"
                : "${PARAM_PR_NUMBER:=""}"
                : "${PARAM_TARGET_BRANCH:=""}"
                : "${AUTH_PATH:=""}"

                # No separate clone step: `k8s-gitops-ci pipeline --url`
                # clones into its own temp directory internally (see
                # pkg/git.Clone) and cleans up after itself. gh auth setup-git
                # installs a git credential helper for that internal clone,
                # same rationale as the `build` step's own clone above.
                gh auth login --hostname "github.com" \
                  --with-token <"${AUTH_PATH}/git-provider-token"
                gh auth setup-git --hostname "github.com"

                k8s-gitops-ci pipeline \
                  --url "${PARAM_GIT_URL}" \
                  --pr "${PARAM_PR_NUMBER}" \
                  --revision "${PARAM_REVISION}" \
                  --target-branch "${PARAM_TARGET_BRANCH}" \
                  --lint-only \
                  --disable-checks golangci \
                  --comment

      # TODO: clair scan (re-enable once image build is wired up)
      # - name: clair-action
      #   runAfter:
      #     - build
      #   taskRef:
      #     name: clair-action
      #     kind: Task
      #   params:
      #     - name: IMAGE
      #       value: $(tasks.build.results.IMAGE)

  taskRunTemplate:
    serviceAccountName: pipeline
    podTemplate:
      runtimeClassName: selinux
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
  workspaces:
    - name: git_auth_secret
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: go-cache
      persistentVolumeClaim:
        claimName: go-cache
