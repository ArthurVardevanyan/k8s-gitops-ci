apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: gitops-ci-push
  annotations:
    pipelinesascode.tekton.dev/on-event: '[push]'
    pipelinesascode.tekton.dev/on-target-branch: '[main]'
    pipelinesascode.tekton.dev/task: '[git-clone, gitops-ci]'
spec:
  pipelineRef:
    name: gitops-ci
  params:
    - name: repo-url
      value: '{{repo_url}}'
    - name: revision
      value: '{{revision}}'
    - name: target-branch
      value: '{{target_branch}}'
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
