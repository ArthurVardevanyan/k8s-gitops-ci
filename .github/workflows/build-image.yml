# This workflow builds a multi-arch Docker image using GitHub Actions with native
# support for ARM64 and AMD64 architectures, without using QEMU emulation.
# Each platform runs on its own native runner to avoid cross-emulation issues.
name: build-image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' }}
    name: Build image for ${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare environment
        id: prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "PLATFORM_TAG=${platform//\//-}" >> $GITHUB_ENV
          REPO="${{ github.repository }}"
          echo "GHCR_IMAGE_LOWER=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: actions/checkout@v5

      - name: Set up Docker Context for Buildx
        run: docker context create builders

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builders
          platforms: ${{ matrix.platform }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.GHCR_IMAGE_LOWER }}:${{ env.PLATFORM_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          TAG_NAME="${{ env.PLATFORM_TAG }}"
          IMAGE="${{ env.GHCR_IMAGE_LOWER }}:${TAG_NAME}"
          digest=$(docker inspect "$IMAGE" --format '{{index .RepoDigests 0 }}' 2>/dev/null | cut -d@ -f2 | sed 's/^sha256://')
          if [ -z "$digest" ]; then
            digest=$(docker inspect "$IMAGE" --format '{{.Id}}' 2>/dev/null | cut -d@ -f2)
          fi
          echo "$digest" > "/tmp/digests/${TAG_NAME}.sha256"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*.sha256
          retention-days: 1

  merge:
    # Only merge on push to main (not on PR builds)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      attestations: write
      actions: read
      checks: read
      contents: read
      deployments: none
      id-token: write
      issues: read
      discussions: read
      packages: write
      pages: none
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare environment
        run: |
          REPO="${{ github.repository }}"
          echo "GHCR_IMAGE_LOWER=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Check if VERSION changed
        id: version
        run: |
          if git diff --quiet HEAD~1..HEAD -- VERSION; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Download digests
        if: steps.version.outputs.changed == 'true'
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker metadata
        if: steps.version.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_LOWER }}
          tags: |
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Set up Docker Buildx
        if: steps.version.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Login to GHCR
        if: steps.version.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        if: steps.version.outputs.changed == 'true'
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_IMAGE_LOWER}@sha256:%s " $(cat /tmp/digests/*.sha256 | tr '\n' ' '))

      - name: Inspect image
        if: steps.version.outputs.changed == 'true'
        run: |
          docker buildx imagetools inspect '${{ env.GHCR_IMAGE_LOWER }}:latest'
