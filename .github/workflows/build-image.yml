name: build-image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase repository for GHCR
        id: repo
        run: |
          REPO="${{ github.repository }}"
          echo "IMAGE=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.IMAGE }}
          tags: |
            type=ref,event=pr,prefix=pr-,suffix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,suffix=
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Lowercase repository for GHCR
        id: repo
        run: |
          REPO="${{ github.repository }}"
          echo "PACKAGE=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - run: |
          PR_NUM=${{ github.event.pull_request.number }}
          PR_TAG="pr-${PR_NUM}"
          echo "Deleting PR tag ${PR_TAG}..."
          JSON=$(gh api repos/${{ github.repository }}/packages/containers/${{ steps.repo.outputs.PACKAGE }}/versions \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /dev/stdout 2>/dev/null)
          PACKAGE_VERSION_ID=$(echo "$JSON" | jq -r '
            .[] | select(.metadata.tags[]? == "'"${PR_TAG}"'") | .id
          ' | head -1)
          if [ -n "${PACKAGE_VERSION_ID}" ] && [ "${PACKAGE_VERSION_ID}" != "null" ]; then
            gh api -X DELETE repos/${{ github.repository }}/packages/containers/${{ steps.repo.outputs.PACKAGE }}/versions/${PACKAGE_VERSION_ID} \
              -H "X-GitHub-Api-Version: 2022-11-28"
            echo "Deleted package version ${PACKAGE_VERSION_ID} for tag ${PR_TAG}"
          else
            echo "No package version found for tag ${PR_TAG} (JSON length: $(echo "$JSON" | jq 'length'))"
          fi
