# This workflow builds a multi-arch Docker image using GitHub Actions with native
# support for ARM64 and AMD64 architectures, without using QEMU emulation.
# Each platform runs on its own native runner to avoid cross-emulation issues.
name: build-image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    permissions:
      attestations: write
      actions: read
      checks: write
      contents: write
      deployments: none
      id-token: write
      issues: read
      discussions: read
      packages: write
      pages: none
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: read
    # Use native runner for each platform:
    #   amd64  -> standard ubuntu-latest runner
    #   arm64  -> ubuntu-24.04-arm (native ARM runner)
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' }}
    name: Build image for ${{ matrix.platform }}
    steps:
      - name: Prepare environment
        id: prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          REPO="${{ github.repository }}"
          echo "GHCR_IMAGE_LOWER=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: actions/checkout@v5

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_LOWER }}
          tags: |
            type=ref,event=pr,prefix=pr-,suffix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,suffix=
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Set up Docker Context for Buildx
        run: docker context create builders

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builders
          platforms: ${{ matrix.platform }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ env.GHCR_IMAGE_LOWER }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Only merge on push to main (not on PR builds)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      attestations: write
      actions: read
      checks: read
      contents: read
      deployments: none
      id-token: write
      issues: read
      discussions: read
      packages: write
      pages: none
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_LOWER }}
          tags: |
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_IMAGE_LOWER }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect '${{ env.GHCR_IMAGE_LOWER }}:${{ steps.meta.outputs.version }}'

  cleanup:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - name: Lowercase repository for GHCR
        id: repo
        run: |
          REPO="${{ github.repository }}"
          echo "PACKAGE=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - run: |
          PR_NUM=${{ github.event.pull_request.number }}
          PR_TAG="pr-${PR_NUM}"
          echo "Deleting PR tag ${PR_TAG}..."
          JSON=$(gh api repos/${{ github.repository }}/packages/containers/${{ steps.repo.outputs.PACKAGE }}/versions \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /dev/stdout 2>/dev/null)
          PACKAGE_VERSION_ID=$(echo "$JSON" | jq -r '
            .[] | select(.metadata.tags[]? == "'"${PR_TAG}"'") | .id
          ' | head -1)
          if [ -n "${PACKAGE_VERSION_ID}" ] && [ "${PACKAGE_VERSION_ID}" != "null" ]; then
            gh api -X DELETE repos/${{ github.repository }}/packages/containers/${{ steps.repo.outputs.PACKAGE }}/versions/${PACKAGE_VERSION_ID} \
              -H "X-GitHub-Api-Version: 2022-11-28"
            echo "Deleted package version ${PACKAGE_VERSION_ID} for tag ${PR_TAG}"
          else
            echo "No package version found for tag ${PR_TAG} (JSON length: $(echo "$JSON" | jq 'length'))"
          fi
