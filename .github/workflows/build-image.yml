# This workflow builds a multi-arch Docker image using GitHub Actions with native
# support for ARM64 and AMD64 architectures, without using QEMU emulation.
# Each platform runs on its own native runner to avoid cross-emulation issues.
name: build-image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' }}
    name: Build image for ${{ matrix.platform }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare environment
        id: prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          echo "PLATFORM_TAG=${platform//\//-}" >> $GITHUB_ENV
          REPO="${{ github.repository }}"
          echo "GHCR_IMAGE_LOWER=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: actions/checkout@v5

      - name: Set up Docker Context for Buildx
        run: docker context create builders

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builders
          platforms: ${{ matrix.platform }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and export
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.GHCR_IMAGE_LOWER }}:${{ env.PLATFORM_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          TAG_NAME="${{ env.PLATFORM_TAG }}"
          IMAGE="${{ env.GHCR_IMAGE_LOWER }}:${TAG_NAME}"
          # .RepoDigests is empty for a locally-loaded (unpushed) image, so
          # fall back to the image ID. Strip a "repo@" prefix (if present) and
          # a leading "sha256:" so the stored value is always a bare 64-char
          # hex digest — the merge job re-prefixes it with "sha256:".
          digest=$(docker inspect "$IMAGE" --format '{{index .RepoDigests 0 }}' 2>/dev/null | sed -e 's/.*@//' -e 's/^sha256://')
          if [ -z "$digest" ]; then
            digest=$(docker inspect "$IMAGE" --format '{{.Id}}' 2>/dev/null | sed 's/^sha256://')
          fi
          if [ -z "$digest" ]; then
            echo "::error::No digest found for $IMAGE (both .RepoDigests and .Id were empty)"
            exit 1
          fi
          echo "$digest" > "/tmp/digests/${TAG_NAME}.sha256"
          echo "Saved digest for $TAG_NAME: $digest"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*.sha256
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      attestations: write
      actions: read
      checks: read
      contents: read
      deployments: none
      id-token: write
      issues: read
      discussions: read
      packages: write
      pages: none
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare environment
        run: |
          REPO="${{ github.repository }}"
          echo "GHCR_IMAGE_LOWER=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Check if VERSION changed
        id: version
        run: |
          if git diff --quiet HEAD~1..HEAD -- VERSION; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          VERSION="$(cat VERSION)"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_mm=${VERSION%.*}" >> $GITHUB_OUTPUT
          echo "version_major=${VERSION%%.*}" >> $GITHUB_OUTPUT

      - name: Validate image tags (preview)
        run: |
          VERSION="$(cat VERSION)"
          echo "Current VERSION = ${VERSION}"
          echo ""
          echo "On a push to main that bumps VERSION, these tags are pushed:"
          echo "  - main           (always, on every push to main)"
          echo "  - latest         (only when VERSION changes)"
          echo "  - ${VERSION}    (full semver)"
          echo "  - ${VERSION%.*}  (major.minor)"
          echo "  - ${VERSION%%.*} (major)"
          echo ""
          echo "On a push to main that does NOT bump VERSION, only main is updated."

      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Validate digest files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/digests/*.sha256)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No digest files were produced by the build job(s)"
            exit 1
          fi
          for f in "${files[@]}"; do
            d=$(tr -d '[:space:]' < "$f")
            echo "Checking $(basename "$f"): $d"
            if [[ "$d" =~ ^[0-9a-f]{64}$ ]]; then
              echo "  OK: bare 64-char hex digest"
            else
              echo "::error::Malformed digest in $f: '$d' (must be a bare 64-char hex digest)"
              exit 1
            fi
          done

      - name: Docker metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE_LOWER }}
          tags: |
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' && steps.version.outputs.changed == 'true' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref_name == 'main' && steps.version.outputs.changed == 'true' }}
            type=raw,value=${{ steps.version.outputs.version_mm }},enable=${{ github.ref_name == 'main' && steps.version.outputs.changed == 'true' }}
            type=raw,value=${{ steps.version.outputs.version_major }},enable=${{ github.ref_name == 'main' && steps.version.outputs.changed == 'true' }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        if: github.event_name == 'push'
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_IMAGE_LOWER}@sha256:%s " $(cat /tmp/digests/*.sha256 | tr '\n' ' '))

      - name: Inspect image
        if: github.event_name == 'push'
        run: |
          docker buildx imagetools inspect '${{ env.GHCR_IMAGE_LOWER }}:latest'
