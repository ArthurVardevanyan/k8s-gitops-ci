# This workflow builds a multi-arch Docker image for linux/amd64 and linux/arm64
# using a single multi-platform build, pushing one final multi-arch tag.
name: build-image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare environment
        id: prepare
        run: |
          REPO="${{ github.repository }}"
          GHCR="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          # push_images: true only for push-to-main, false for PRs and fork PRs
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "push_images=true" >> $GITHUB_OUTPUT
            echo "TAG=${GHCR}:$(cat VERSION)" >> $GITHUB_OUTPUT
          else
            echo "push_images=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GHCR
        if: steps.prepare.outputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.prepare.outputs.push_images == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prepare.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build only (no push)
        if: steps.prepare.outputs.push_images == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
