# Builds each architecture on a matching native runner via a matrix (amd64 on
# an amd64 runner, arm64 on an arm64 runner - no QEMU), then merges them into
# a multi-arch index.
#
# Per-arch images are pushed by digest only (push-by-digest): they carry no
# tag, so the tag list only ever contains `main`, `latest` and release
# versions like `0.62.6`. Provenance/SBOM attestations are disabled so no
# extra untagged versions or `unknown/unknown` index entries appear.
#
# The merge job:
#
#  - always (re)creates the `main` index - it tracks the newest commit;
#  - on a GA (`VERSION` advanced) also creates `${VERSION}` and `latest`;
#    these stay pinned to the GA commit and are never moved again. On
#    non-release pushes only `main` advances.
#
# The prune job then deletes every package version that is neither a kept
# tag (`main`, `latest`, `X.Y.Z`) nor a per-arch image referenced by one
# (prune job below). GHCR cannot untag, so this goes through the GitHub
# Packages API.

name: build-image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    runs-on: ${{ matrix.platform == 'linux/amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    name: Build (${{ matrix.platform }})
    steps:
      - uses: actions/checkout@v5

      - name: Prepare
        id: prep
        run: |
          PLATFORM=${{ matrix.platform }}
          PAIR="${PLATFORM//\//-}"
          REPO="${{ github.repository }}"
          GHCR="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          VERSION="$(cat VERSION)"
          # Commit timestamp (UTC) keeps a rebuild of the same commit
          # byte-for-byte reproducible.
          BUILD_TIME="$(TZ=UTC git show -s --format=%cd --date='format:%Y-%m-%dT%H:%M:%SZ' HEAD 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "do_push=true" >> $GITHUB_OUTPUT
          else
            echo "do_push=false" >> $GITHUB_OUTPUT
          fi
          echo "ghcr=$(echo "ghcr.io/$REPO" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "platform_pair=${PAIR}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.prep.outputs.do_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          # Push: by digest, no tag. PR: load into the local daemon only.
          push: false
          load: ${{ steps.prep.outputs.do_push == 'false' }}
          outputs: ${{ steps.prep.outputs.do_push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.prep.outputs.ghcr) || '' }}
          tags: ${{ steps.prep.outputs.do_push == 'false' && format('local/k8s-gitops-ci:{0}', env.platform_pair) || '' }}
          build-args: |
            BUILD_VERSION=${{ steps.prep.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.prep.outputs.build_time }}
            BUILD_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No attestations: they add extra untagged package versions and
          # `unknown/unknown` entries to the merged index.
          provenance: false
          sbom: false

      - name: Export digest
        if: steps.prep.outputs.do_push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: steps.prep.outputs.do_push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Show image labels (PR)
        if: steps.prep.outputs.do_push == 'false'
        run: |
          echo "Labels baked into image:"
          docker inspect --format '{{json .Config.Labels}}' \
            "local/k8s-gitops-ci:${{ env.platform_pair }}" | jq .

  merge:
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'push' && github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Classify push (GA vs CI-only)
        id: classify
        run: |
          set -euo pipefail
          CUR="$(cat VERSION)"
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            BEFORE="$(git rev-parse -q --verify HEAD~1 2>/dev/null || echo "")"
          fi
          PREV="$(git show "${BEFORE}:VERSION" 2>/dev/null || echo "")"
          if [ -n "$PREV" ] && [ "$CUR" != "$PREV" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "VERSION advanced ${PREV} -> ${CUR}: GA release. Publishing \`${CUR}\` + \`latest\` + main."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            if [ -z "$PREV" ]; then
              echo "No prior VERSION resolvable; treating as CI-only (updating main only)."
            else
              echo "VERSION unchanged at ${CUR}: CI-only. Updating main only; \`${CUR}\` and latest left untouched."
            fi
          fi

      - name: Create and push multi-arch indexes
        run: |
          set -euo pipefail
          GHCR="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ steps.version.outputs.version }}"
          DIGESTS=("${RUNNER_TEMP}"/digests/*)
          if [ "${#DIGESTS[@]}" -ne 2 ]; then
            echo "::error::Expected 2 digests (amd64 + arm64), found ${#DIGESTS[@]}"
            exit 1
          fi
          REFS=()
          for F in "${DIGESTS[@]}"; do
            REFS+=("${GHCR}@sha256:$(basename "$F")")
          done
          TAGS=(-t "${GHCR}:main")
          if [ "${{ steps.classify.outputs.release }}" = "true" ]; then
            TAGS+=(-t "${GHCR}:${VERSION}" -t "${GHCR}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "${REFS[@]}"
          echo "Pushed: ${TAGS[*]}"

      - name: Verify indexes
        run: |
          GHCR="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="main"
          if [ "${{ steps.classify.outputs.release }}" = "true" ]; then
            TAGS="${TAGS} ${VERSION} latest"
          fi
          for TAG in $TAGS; do
            REF="${GHCR}:${TAG}"
            echo "=== ${REF} ==="
            INSPECT="$(docker manifest inspect "$REF")"
            echo "$INSPECT"
            TOTAL="$(echo "$INSPECT" | jq '.manifests | length')"
            BAD="$(echo "$INSPECT" | jq '[.manifests[] | select((.platform == null) or (.platform.os == "unknown") or (.platform.architecture == "unknown"))] | length')"
            if [ "$TOTAL" -ne 2 ] || [ "$BAD" -ne 0 ]; then
              echo "::error::${REF} is invalid: ${TOTAL} entries, ${BAD} with unknown/missing platform"
              exit 1
            fi
          done
          echo "All indexes valid: 2 platforms each, no unknown/unknown entries."

  prune:
    runs-on: ubuntu-latest
    needs: [build, merge]
    if: |
      github.event_name == 'push' && github.ref_name == 'main'
    steps:
      # GHCR cannot untag (registry Tag DELETE returns 405), so cleanup goes
      # through the Packages API, which deletes a whole package version.
      # Deleting a version an index still references breaks that index, so
      # only versions that are neither a kept tag nor a child of one are
      # deleted, and nothing is deleted if a kept tag cannot be verified.
      - name: Prune unreferenced package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          set -euo pipefail
          REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          OWNER="${REPO%%/*}"
          PKG="${REPO#*/}"
          KEEP_RE='^(main|latest|[0-9]+\.[0-9]+\.[0-9]+)$'
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'

          if [ "$OWNER_TYPE" = "Organization" ]; then
            API="/orgs/${OWNER}/packages/container/${PKG}/versions"
          else
            API="/users/${OWNER}/packages/container/${PKG}/versions"
          fi

          REG_TOKEN="$(curl -sf --user "x-access-token:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:pull" | jq -r .token)"
          if [ -z "$REG_TOKEN" ] || [ "$REG_TOKEN" = "null" ]; then
            echo "::error::Could not obtain a GHCR registry token; nothing pruned."
            exit 1
          fi

          # registry_get <tag-or-digest> [curl args...]
          registry_get() {
            local ref="$1"
            shift
            curl -sf -H "Authorization: Bearer ${REG_TOKEN}" -H "Accept: ${ACCEPT}" \
              "$@" "https://ghcr.io/v2/${REPO}/manifests/${ref}"
          }

          # verify_kept: every kept tag must resolve with every child present.
          # Prints each kept version digest and child digest to stdout.
          verify_kept() {
            local tag body d
            while read -r tag; do
              [ -z "$tag" ] && continue
              body="$(registry_get "$tag")" || {
                echo "::error::Kept tag ${tag} cannot be read from the registry." >&2
                return 1
              }
              for d in $(jq -r '.manifests[]?.digest' <<<"$body"); do
                registry_get "$d" -o /dev/null -I || {
                  echo "::error::Tag ${tag} references ${d}, which is missing." >&2
                  return 1
                }
                echo "$d"
              done
            done < <(jq -r --arg re "$KEEP_RE" '.[].metadata.container.tags[] | select(test($re))' <<<"$KEPT_TAGGED" | sort -u)
          }

          VERSIONS="$(gh api --paginate "${API}?per_page=100" --jq '.[]' | jq -s '.')"
          echo "Package has $(jq length <<<"$VERSIONS") version(s)."

          KEPT_TAGGED="$(jq -c --arg re "$KEEP_RE" \
            '[.[] | select((.metadata.container.tags // []) | any(test($re)))]' <<<"$VERSIONS")"
          if [ "$(jq length <<<"$KEPT_TAGGED")" -eq 0 ]; then
            echo "::error::No version carries a kept tag (main/latest/X.Y.Z); refusing to prune."
            exit 1
          fi

          CHILDREN="$(verify_kept)"
          KEEP_DIGESTS="$( (jq -r '.[].name' <<<"$KEPT_TAGGED"; echo "$CHILDREN") | sed '/^$/d' | sort -u)"
          echo "Keeping:"
          while read -r d; do echo "  $d"; done <<<"$KEEP_DIGESTS"

          FAILED=0
          while IFS=$'\t' read -r ID DIGEST TAGS; do
            [ -z "$ID" ] && continue
            grep -qFx "$DIGEST" <<<"$KEEP_DIGESTS" && continue
            echo "Deleting ${ID} ${DIGEST:0:19} [${TAGS}]"
            gh api -X DELETE "${API}/${ID}" >/dev/null || {
              echo "::warning::Failed to delete version ${ID}"
              FAILED=$((FAILED + 1))
            }
          done < <(jq -r '.[] | [.id, .name, ((.metadata.container.tags // []) | join(","))] | @tsv' <<<"$VERSIONS")

          verify_kept >/dev/null
          echo "Post-prune verification passed."
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::${FAILED} deletion(s) failed."
            exit 1
          fi
