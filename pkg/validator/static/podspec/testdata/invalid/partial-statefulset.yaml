apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: partial
spec:
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      containers:
        - name: c
          image: example.com/app@sha256:deadbeef
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
