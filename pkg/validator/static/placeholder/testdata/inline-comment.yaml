apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: internal-cert
  namespace: unifi-network-application
spec:
  data:
    - secretKey: tls.crt
      remoteRef: # checkov:skip=CKV_SECRET_6 PlaceHolder Values
        key: homelab/unifi
        property: tls.crt
    - secretKey: tls.key
      remoteRef: # checkov:skip=CKV_SECRET_6 PlaceHolder Values
        key: homelab/unifi
        property: tls.key
    - secretKey: password
      remoteRef:
        key: homelab/unifi
        property: password
