apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-liveness
  namespace: default
spec:
  selector:
    matchLabels:
      app: missing-liveness
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      containers:
        - name: app
          image: registry.example.com/nginx@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          resources:
            requests:
              cpu: 10m
            limits:
              cpu: 100m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
