apiVersion: generators.external-secrets.io/v1alpha1
kind: QuayAccessToken
metadata:
  name: k8s-gitops-ci
  namespace: k8s-gitops-ci
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  url: registry.arthurvardevanyan.com
  robotAccount: homelab+k8s_push
  serviceAccountRef:
    name: "pipeline"
    audiences:
      - openshift
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-gitops-ci
  namespace: k8s-gitops-ci
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: QuayAccessToken
          name: k8s-gitops-ci
  refreshInterval: "55m" # Overlap with Token Expire
  target:
    name: k8s-gitops-ci-push-pull-secret
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .registry }}": {
                "auth": "{{ .auth }}"
              }
            }
          }
